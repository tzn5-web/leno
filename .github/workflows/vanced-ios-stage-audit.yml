name: VancedIOS Stage Audit

on:
  push:
    branches:
      - vanced-ios-stage-audit
    paths:
      - "VancedIOS/**"
      - ".github/workflows/vanced-ios-*.yml"
  pull_request:
    branches:
      - vanced-ios-patcher
    paths:
      - "VancedIOS/**"
      - ".github/workflows/vanced-ios-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanced-ios-stage-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: brew install make ldid dpkg

      - name: Run exhaustive stage runner
        run: |
          set -euo pipefail
          python3 VancedIOS/Scripts/stage_runner.py \
            --build \
            --report-dir artifacts/vanced-ios-stage-audit

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VancedIOS-stage-audit-evidence
          path: artifacts/vanced-ios-stage-audit/
          if-no-files-found: warn
