name: K2401 Azure emulator diagnostics export (VM stays off)
on:
  push:
    branches: [feature/k2401-evo-launcher]
    paths: ['.github/workflows/k2401-azure-diagnostics-export.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  export-failed-azure-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: azure/login@v3
        with:
          client-id: 50a5c260-15a0-4aa0-9e02-5f0ad5c23df9
          tenant-id: 779623db-ec2e-495b-9828-85d42baa77ee
          subscription-id: 0ac7a514-32b3-47bf-bf89-e17906b1cc86
      - name: Download existing encrypted-access failure archive, never start Azure VM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p azure-emulator-diagnostics
          KEY="$(az storage account keys list -g rg-chatgpt-azure -n tzn5androidartifacts26 --query '[0].value' -o tsv)"
          echo "::add-mask::$KEY"
          az storage blob download --account-name tzn5androidartifacts26 --account-key "$KEY"             --container-name k2401-evo-private             --name frozen-bb8e3132dcfc/k2401-azure-emulator-21-screens.tar.gz             --file azure-emulator-diagnostics/azure-emulator-failed.tar.gz --overwrite true -o none
          tar xzf azure-emulator-diagnostics/azure-emulator-failed.tar.gz -C azure-emulator-diagnostics
          ls -la azure-emulator-diagnostics/emulator-screens
          test -s azure-emulator-diagnostics/emulator-screens/map-recovery-failure.png
          echo 'K2401_AZURE_FAILED_EMULATOR_CAPTURE_EXPORTED=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: k2401-azure-map-recovery-diagnostics
          path: azure-emulator-diagnostics/
          if-no-files-found: error
          retention-days: 7
      - if: always()
        run: az logout || true
