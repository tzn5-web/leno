name: Test Aptoide exact SHAREit 6.27.58 original release metadata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shareit-aptoide-source.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Find exact version and trusted publisher original source through API
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          url='https://ws75.aptoide.com/api/7/app/get/package_name=com.lenovo.anyshare.gps/nodes=meta,versions'
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=25) as r:j=json.load(r)
              print('STATUS',j.get('info',{}).get('status'))
              nodes=j.get('nodes') or {}
              print('NODES',list(nodes.keys()))
              meta=((nodes.get('meta') or {}).get('data') or {})
              print('META',json.dumps({'name':meta.get('name'),'package':meta.get('package'),'file':meta.get('file'),'vername':meta.get('vername')})[:900])
              versions=(nodes.get('versions') or {}).get('list') or []
              print('VERSIONS_TOTAL',len(versions))
              for x in versions[:100]:
                  if ('6.27.58' in str(x) or '6.27.' in str(x)) or len(versions)<10:
                      print('VERSION',json.dumps({'id':x.get('id'),'vername':x.get('vername'),'vercode':x.get('vercode'),'file':x.get('file')})[:1000])
          except Exception as e:print('API_ERROR',type(e).__name__,str(e)[:200])
          PY
