name: AtelierData Windows EXE
on:
  push:
    branches: [atelierdata-20261030]
    paths:
      - 'projects/atelierdata/**'
      - '.github/workflows/atelierdata-windows.yml'
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image viewer dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13" "pypdfium2>=4,<6"
          if ($LASTEXITCODE -ne 0) { throw "PILLOW_INSTALL_FAILED" }
      - name: Python syntax + core application smoke test
        shell: pwsh
        run: |
          python -m py_compile projects/atelierdata/atelierdata.py projects/atelierdata/vehicle_service_card.py projects/atelierdata/vehicle_service_card_gui.py projects/atelierdata/vehicle_service_card_export.py projects/atelierdata/test_vehicle_service_card.py projects/atelierdata/test_vehicle_service_card_export.py projects/atelierdata/vehicle_service_card_gui_smoke.py projects/atelierdata/technical_sources.py projects/atelierdata/technical_sources_gui.py projects/atelierdata/test_technical_sources.py projects/atelierdata/document_library.py projects/atelierdata/document_library_gui.py projects/atelierdata/test_document_library.py projects/atelierdata/workshop_atlas.py projects/atelierdata/workshop_atlas_gui.py projects/atelierdata/test_workshop_atlas.py projects/atelierdata/test_workshop_atlas_viewer.py projects/atelierdata/pdf_text_index.py projects/atelierdata/test_pdf_text_index.py projects/atelierdata/document_bulk_import.py projects/atelierdata/test_document_bulk_import.py projects/atelierdata/document_library_gui_smoke.py projects/atelierdata/technical_source_references.py projects/atelierdata/test_technical_source_references.py projects/atelierdata/sources_gui_smoke.py projects/atelierdata/atelierdata_extensions.py projects/atelierdata/atelierdata_backup.py projects/atelierdata/technical_specs.py projects/atelierdata/repair_procedures.py projects/atelierdata/repair_procedures_gui.py projects/atelierdata/schematic_viewer.py projects/atelierdata/test_schematic_viewer.py projects/atelierdata/dtc_catalog.py projects/atelierdata/dtc_gui.py projects/atelierdata/test_dtc_catalog.py projects/atelierdata/vpic_catalog.py projects/atelierdata/vpic_catalog_gui.py projects/atelierdata/test_vpic_catalog.py projects/atelierdata/maintenance_plans.py projects/atelierdata/maintenance_gui.py projects/atelierdata/test_maintenance_plans.py projects/atelierdata/repair_export.py projects/atelierdata/test_repair_export.py projects/atelierdata/test_extensions.py projects/atelierdata/test_technical_specs.py projects/atelierdata/test_repair_procedures.py projects/atelierdata/test_procedure_schematic_navigation.py projects/atelierdata/procedure_audit.py projects/atelierdata/test_procedure_audit.py projects/atelierdata/procedure_audit_export.py projects/atelierdata/test_procedure_audit_export.py projects/atelierdata/procedure_audit_html.py projects/atelierdata/test_procedure_audit_html.py projects/atelierdata/procedure_usage.py projects/atelierdata/test_procedure_usage.py projects/atelierdata/test_procedure_search_literal.py projects/atelierdata/procedure_search_hits.py projects/atelierdata/test_procedure_search_hits.py
          python -m py_compile projects/atelierdata/idf_static_evidence.py projects/atelierdata/rea_resource_audit.py projects/atelierdata/pe_file_io_xrefs.py projects/atelierdata/test_pe_file_io_xrefs.py projects/atelierdata/pe_entrypoint_layout.py projects/atelierdata/test_pe_entrypoint_layout.py projects/atelierdata/pe_delay_import_audit.py projects/atelierdata/test_pe_delay_import_audit.py projects/atelierdata/pe_iat_evidence_validate.py projects/atelierdata/test_pe_iat_evidence_validate.py tools/ghidra/AtelierData_IDF_Xrefs.py
          python -m py_compile projects/atelierdata/catalog_search.py projects/atelierdata/test_catalog_search.py
          python -m py_compile projects/atelierdata/pe_static_call_alignment.py
          python -m py_compile projects/atelierdata/idf_prefix_family_audit.py
          python projects/atelierdata/idf_prefix_family_audit.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "IDF_PREFIX_FAMILY_SELF_TEST_FAILED" }
          python projects/atelierdata/pe_static_call_alignment.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "PE_CALL_ALIGNMENT_SELF_TEST_FAILED" }
          python -m py_compile projects/atelierdata/split_archive_manifest_audit.py
          python -m py_compile projects/atelierdata/full_idf_chunk_audit.py
          python projects/atelierdata/full_idf_chunk_audit.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "COMPLETE_IDF_STATIC_SELF_TEST_FAILED" }
          python projects/atelierdata/split_archive_manifest_audit.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "SPLIT_ARCHIVE_MANIFEST_SELF_TEST_FAILED" }
          python projects/atelierdata/rea_resource_audit.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "REA_RESOURCE_AUDIT_TEST_FAILED" }
          python projects/atelierdata/idf_static_evidence.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "IDF_STATIC_EVIDENCE_TEST_FAILED" }
          python -m unittest discover -s projects/atelierdata -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw "ATELIERDATA_REGRESSION_TEST_FAILED" }
          $searchDb = Join-Path $env:RUNNER_TEMP 'atelierdata-search-ci.sqlite3'
          $searchJson = python projects/atelierdata/atelierdata.py --db-path $searchDb --search-all 'Mitsubishi'
          if ($LASTEXITCODE -ne 0) { throw "SEARCH_CLI_FAILED" }
          $searchResult = ($searchJson -join "`n") | ConvertFrom-Json
          if ($searchResult.schema -ne 'atelierdata-search-v1' -or $searchResult.results.Count -ne 0) { throw "SEARCH_CLI_INVALID_RESULT" }
          python projects/atelierdata/atelierdata.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "SOURCE_TEST_FAILED" }
          python projects/atelierdata/atelierdata.py --ui-smoke
          if ($LASTEXITCODE -ne 0) { throw "SOURCE_GUI_SMOKE_FAILED" }
          python projects/atelierdata/sources_gui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "TECHNICAL_SOURCES_GUI_SMOKE_FAILED" }
          python projects/atelierdata/document_library_gui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "DOCUMENT_LIBRARY_GUI_SMOKE_FAILED" }
          python projects/atelierdata/vehicle_service_card_gui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "VEHICLE_SERVICE_CARD_GUI_SMOKE_FAILED" }
      - name: Build one-file Windows EXE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all pypdfium2 --name AtelierData projects/atelierdata/atelierdata.py
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_BUILD_FAILED" }
      - name: Run real compiled EXE self-test
        shell: pwsh
        run: |
          $exePath = (Resolve-Path '.\dist\AtelierData.exe').Path
          $process = Start-Process -FilePath $exePath -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "PACKAGED_EXE_SELF_TEST_FAILED exit=$($process.ExitCode)" }
          $searchDb = Join-Path $env:RUNNER_TEMP 'atelierdata-exe-search-ci.sqlite3'
          $search = Start-Process -FilePath $exePath -ArgumentList @('--db-path', $searchDb, '--search-all', 'Mitsubishi') -Wait -PassThru
          if ($search.ExitCode -ne 0) { throw "PACKAGED_SEARCH_CLI_FAILED exit=$($search.ExitCode)" }
          $ui = Start-Process -FilePath $exePath -ArgumentList '--ui-smoke' -Wait -PassThru
          if ($ui.ExitCode -ne 0) { throw "PACKAGED_GUI_TEST_FAILED exit=$($ui.ExitCode)" }
          Write-Host "GUI_SMOKE_TEST=PASS"
          if (-not (Test-Path ".\dist\AtelierData.exe")) { throw "EXE_MISSING" }
          $file = Get-Item ".\dist\AtelierData.exe"
          $sha = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
          Write-Host "WINDOWS_EXE_TEST=PASS bytes=$($file.Length) sha256=$sha"
          "AtelierData is an original empty catalog. It does not include or decode Autodata proprietary content." | Set-Content .\dist\README_IMPORTANTE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AtelierData_Windows_OriginalApp
          path: |
            dist/AtelierData.exe
            dist/README_IMPORTANTE.txt
          if-no-files-found: error
          retention-days: 14
