name: K2401 EVO Android 10 APK and emulator
on:
  push:
    branches: [feature/k2401-evo-launcher]
    paths:
      - 'projects/k2401-evo-launcher/**'
      - '.github/workflows/k2401-evo-launcher.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Locate Android SDK manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon -p projects/k2401-evo-launcher :app:assembleDebug
      - name: Verify APK
        run: |
          test -s projects/k2401-evo-launcher/app/build/outputs/apk/debug/app-debug.apk
          sha256sum projects/k2401-evo-launcher/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: k2401-evo-apk
          path: projects/k2401-evo-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -skin 720x1280
          disable-animations: true
          script: |
            set -eu
            APP="ro.evolauncher.k2401"
            OUT="projects/k2401-evo-launcher/screenshots"
            mkdir -p "$OUT"
            adb shell wm density 160
            adb shell settings put system accelerometer_rotation 0
            adb install -r projects/k2401-evo-launcher/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n "$APP/.MainActivity" | tee "$OUT/launch.txt"
            sleep 3
            adb shell wm size > "$OUT/device-info.txt"
            adb shell wm density >> "$OUT/device-info.txt"
            adb shell getprop ro.build.version.release >> "$OUT/device-info.txt"
            adb shell dumpsys display | grep -m 1 'DisplayInfo' >> "$OUT/device-info.txt" || true
            capture() {
              name="$1"
              y="$2"
              adb shell input tap 45 "$y"
              sleep 1
              adb shell pidof "$APP" >/dev/null
              adb shell screencap -p "/sdcard/$name.png"
              adb pull "/sdcard/$name.png" "$OUT/$name.png"
            }
            capture home 120
            capture music 225
            capture navigation 332
            capture car 435
            capture apps 545
            capture settings 645
            python3 - <<'PY'
            from pathlib import Path
            from struct import unpack
            folder=Path("projects/k2401-evo-launcher/screenshots")
            for name in ("home","music","navigation","car","apps","settings"):
                data=(folder/(name+".png")).read_bytes()
                assert data[:8]==b"\x89PNG\r\n\x1a\n", name+": invalid screenshot"
                w,h=unpack(">II",data[16:24])
                print(f"SCREEN {name}: {w}x{h}")
                assert (w,h)==(1280,720), f"{name}: wrong landscape resolution {w}x{h}"
            PY
            # Verify repeated page changes, cold starts and native Android heap metrics.
            for i in $(seq 1 6); do
              adb shell input tap 45 225
              adb shell input tap 45 645
              adb shell input tap 45 120
            done
            adb shell am force-stop "$APP"
            adb shell am start -W -n "$APP/.MainActivity" >> "$OUT/launch.txt"
            sleep 2
            adb shell pidof "$APP" >/dev/null
            adb shell dumpsys meminfo "$APP" > "$OUT/memory.txt"
            adb shell dumpsys gfxinfo "$APP" > "$OUT/gfxinfo.txt"
            adb logcat -d > "$OUT/logcat.txt"
            adb logcat -d -s AndroidRuntime:E > "$OUT/crashes.txt"
            if grep -E 'FATAL EXCEPTION|ANR in ro.evolauncher.k2401' "$OUT/logcat.txt"; then
              echo "CRASH_OR_ANR_DETECTED" >&2
              exit 3
            fi
            echo "SIX_SCREEN_EMULATOR_SMOKE=PASS; RESOLUTION=1280x720; RESTART=PASS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k2401-evo-emulator-screens
          path: projects/k2401-evo-launcher/screenshots/
          retention-days: 14