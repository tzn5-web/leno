name: K2401 EVO Android 10 APK and emulator
on:
  push:
    branches: [feature/k2401-evo-launcher]
    paths:
      - 'projects/k2401-evo-launcher/**'
      - '.github/workflows/k2401-evo-launcher.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact 21-theme image restoration dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0" "opencv-contrib-python-headless==4.10.0.84"
      - name: Verify all 20 native layout geometries and 21-theme UI contracts
        run: python3 projects/k2401-evo-launcher/scripts/verify-native-layout.py
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Locate Android SDK manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate release claims and optional Maps credential
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'isConnectedToECU()' projects/k2401-evo-launcher/app/src/main/aidl/org/prowl/torque/remote/ITorqueService.aidl
          grep -Fq 'getPIDUpdateTime' projects/k2401-evo-launcher/app/src/main/java/ro/evolauncher/k2401/ObdReader.java
          grep -Fq 'com.google.android.geo.API_KEY' projects/k2401-evo-launcher/app/src/main/AndroidManifest.xml
          if grep -Eq 'HARTĂ DEMO|Str\\. Mihai Viteazul|Blinding Lights' projects/k2401-evo-launcher/app/src/main/java/ro/evolauncher/k2401/MainActivity.java; then
            echo '::error::Demo navigation or fake track still present in production MainActivity'
            exit 2
          fi
          echo 'K2401_STATIC_PRODUCTION_DATA_GATE=PASS'
      - name: Build debug APK
        env:
          K2401_MAPS_API_KEY: ${{ secrets.K2401_MAPS_API_KEY }}
        run: |
          if [[ -n "${K2401_MAPS_API_KEY:-}" ]]; then
            echo 'GOOGLE_MAPS_API_KEY_CONFIGURED=YES'
          else
            echo 'GOOGLE_MAPS_API_KEY_CONFIGURED=NO; REAL_OSM_FALLBACK=YES'
          fi
          K2401_REQUIRE_SR=YES gradle --no-daemon -p projects/k2401-evo-launcher :app:assembleDebug
      - name: Verify APK
        run: |
          test -s projects/k2401-evo-launcher/app/build/outputs/apk/debug/app-debug.apk
          sha256sum projects/k2401-evo-launcher/app/build/outputs/apk/debug/app-debug.apk
      - name: Assert all twenty-one hi-res skins shipped in debug APK
        run: |
          python3 - <<'PY'
          import io,zipfile
          from PIL import Image
          apk="projects/k2401-evo-launcher/app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk) as z:
            for i in range(21):
              hi=f"assets/skins/uhd/skin_{i:02}.webp"
              clean=f"assets/skins/clean/skin_{i:02}.webp"
              assert hi in z.namelist() and clean in z.namelist(), (hi,clean)
              with Image.open(io.BytesIO(z.read(hi))) as im:
                assert im.size==(2560,1440),hi
              with Image.open(io.BytesIO(z.read(clean))) as im:
                assert im.size==(2560,1440),clean
          print("K2401_21_NATIVE_CLEAN_THEME_ASSETS=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k2401-evo-apk
          path: projects/k2401-evo-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -skin 720x1280
          disable-animations: true
          script: bash projects/k2401-evo-launcher/scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k2401-evo-emulator-screens
          path: projects/k2401-evo-launcher/screenshots/
          retention-days: 14