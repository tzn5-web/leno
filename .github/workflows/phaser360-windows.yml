name: Phaser360 Windows Full Audio Driver

concurrency:
  group: phaser360-windows-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - phaser360-sof-windows-port
    paths:
      - "Phaser360/**"
      - ".github/workflows/phaser360-windows.yml"
  pull_request:
    paths:
      - "Phaser360/**"
      - ".github/workflows/phaser360-windows.yml"

jobs:
  audit-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Core smoke
        run: sh Phaser360/tests/run_core_smoke.sh

      - name: Full-install source contracts
        run: python3 Phaser360/tests/source_contract.py

      - name: B4 and IRQ regressions
        run: sh Phaser360/tests/run_b4_core.sh

      - name: NHLT parser regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            Phaser360/tests/nhlt_regression.c \
            Phaser360/src/p360_nhlt.c \
            Phaser360/src/p360_board.c \
            -IPhaser360/include \
            -o /tmp/p360_nhlt_regression
          /tmp/p360_nhlt_regression

  build-x64:
    needs: audit-core
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore pinned WDK and SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          nuget restore Phaser360\packages.config -PackagesDirectory Phaser360\packages -NonInteractive -Verbosity detailed

          foreach($p in @(
            "Phaser360\packages\Microsoft.Windows.WDK.x64.10.0.26100.6584\build\native\Microsoft.Windows.WDK.x64.props",
            "Phaser360\packages\Microsoft.Windows.SDK.CPP.x64.10.0.26100.6584\build\native\Microsoft.Windows.SDK.cpp.x64.props",
            "Phaser360\packages\Microsoft.Windows.SDK.CPP.10.0.26100.6584\build\native\Microsoft.Windows.SDK.cpp.props"
          )) {
            if (-not (Test-Path -LiteralPath $p)) {
              throw "Missing pinned build dependency: $p"
            }
          }

      - name: Build complete MAX98357A amplifier driver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild Phaser360\max98357a_safe\P360Max98357Safe.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /v:minimal
          $sys="Phaser360\max98357a_safe\out\Release\P360Max98357Safe.sys"
          if (-not (Test-Path -LiteralPath $sys)) { throw "MAX98357A driver build failed" }
          Write-Host "P360_MAX98357A_BUILD=PASS"
          Write-Host "SHA256=$((Get-FileHash $sys -Algorithm SHA256).Hash)"

      - name: Build complete P360SofAudio driver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild Phaser360\driver\P360SofAudio.vcxproj /m /t:Rebuild \
            /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off \
            /p:P360PortClsShellEnabled=1 \
            /p:P360RuntimeBootEnabled=1 \
            /p:P360IpcProbeEnabled=1 \
            /p:P360SpeakerEndpointEnabled=1 \
            /p:P360HostPlaybackEnabled=1 \
            /p:P360InternalSpeakerEnabled=1 \
            /p:P360ToneTopologyProofEnabled=0 \
            /p:P360BoundedToneTestEnabled=0 \
            /v:minimal

          $sys="Phaser360\driver\out\Release\P360SofAudio.sys"
          if (-not (Test-Path -LiteralPath $sys)) { throw "P360SofAudio build failed" }
          Write-Host "P360_FULL_AUDIO_DRIVER_BUILD=PASS"
          Write-Host "SHA256=$((Get-FileHash $sys -Algorithm SHA256).Hash)"

      - name: Compile WASAPI endpoint verifier
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcvars = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found" }
          $out = "Phaser360\driver\out\Release\P360_WASAPI_TEST.exe"
          $cmd = ('call "{0}" && cl.exe /nologo /O2 /MT /W4 /EHsc /DUNICODE /D_UNICODE /Fe:"{1}" Phaser360\production\P360_WASAPI_TEST.cpp ole32.lib uuid.lib propsys.lib' -f $vcvars,$out)
          & cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) {
            throw "P360_WASAPI_TEST.exe compile failed"
          }
          Write-Host "P360_WASAPI_VERIFIER_BUILD=PASS"

      - name: Compile forced driver-binding helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcvars = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found" }
          $out = "Phaser360\driver\out\Release\P360_FORCE_INSTALL.exe"
          $cmd = ('call "{0}" && cl.exe /nologo /O2 /MT /W4 /EHsc /DUNICODE /D_UNICODE /Fe:"{1}" Phaser360\full_install\P360_FORCE_INSTALL.cpp newdev.lib' -f $vcvars,$out)
          & cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) {
            throw "P360_FORCE_INSTALL.exe compile failed"
          }
          Write-Host "P360_FORCE_INSTALL_BUILD=PASS"

      - name: Locate WDK signing tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Find-Tool([string]$Name) {
            $cmd = Get-Command $Name -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) { return $cmd.Source }

            foreach ($kits in @(
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
              "${env:ProgramFiles}\Windows Kits\10\bin"
            )) {
              if (-not (Test-Path $kits)) { continue }
              foreach ($version in (Get-ChildItem $kits -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending)) {
                foreach ($arch in @("x64","x86")) {
                  $candidate = Join-Path $version.FullName (Join-Path $arch $Name)
                  if (Test-Path $candidate) { return $candidate }
                }
              }
            }
            throw "Required Windows Kit tool not found: $Name"
          }

          "P360_INF2CAT=$(Find-Tool 'inf2cat.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "P360_SIGNTOOL=$(Find-Tool 'signtool.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble full-install driver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root="Phaser360\package\P360_FULL_INSTALL"
          Remove-Item "Phaser360\package" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $copies=[ordered]@{
            "Phaser360\driver\out\Release\P360SofAudio.sys" = "P360SofAudio.sys"
            "Phaser360\max98357a_safe\out\Release\P360Max98357Safe.sys" = "P360Max98357Safe.sys"
            "Phaser360\driver\out\Release\P360_WASAPI_TEST.exe" = "P360_WASAPI_TEST.exe"
            "Phaser360\driver\out\Release\P360_FORCE_INSTALL.exe" = "P360_FORCE_INSTALL.exe"
            "Phaser360\production\P360AudioBundle.inx" = "P360AudioBundle.inf"
            "Phaser360\full_install\P360_FULL_INSTALL.ps1" = "P360_FULL_INSTALL.ps1"
            "Phaser360\full_install\INSTALL_PHASER360_AUDIO.cmd" = "INSTALL_PHASER360_AUDIO.cmd"
            "Phaser360\full_install\RESTORE_PHASER360_AUDIO.cmd" = "RESTORE_PHASER360_AUDIO.cmd"
            "Phaser360\full_install\README.txt" = "README.txt"
          }
          foreach($src in $copies.Keys) {
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) {
              throw "Full-install input missing: $src"
            }
            Copy-Item -LiteralPath $src -Destination (Join-Path $root $copies[$src]) -Force
          }

          $payload="Phaser360\firmware\p360-f686.ri.gz"
          $payloadHash=(Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne "221f536ad2e1ccc53ec145573fb8556dd3d7d115322e085d5cfae3faf62e48c3") {
            throw "Firmware payload hash mismatch."
          }

          $firmware=Join-Path $root "p360-f686.ri"
          $input=[IO.File]::OpenRead($payload)
          $output=[IO.File]::Create($firmware)
          try {
            $gzip=[IO.Compression.GZipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
            try { $gzip.CopyTo($output) } finally { $gzip.Dispose() }
          } finally {
            $output.Dispose()
            $input.Dispose()
          }

          $fw=Get-Item $firmware
          $fwHash=(Get-FileHash $firmware -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($fw.Length -ne 246528 -or
              $fwHash -ne "f68694b6197250016a9c5ffb46fa8adaa599a32db95aa19a0ecf5bd4ed1c62ab") {
            throw "Firmware identity mismatch."
          }

          $rsa=[System.Security.Cryptography.RSA]::Create(2048)
          $dn=[System.Security.Cryptography.X509Certificates.X500DistinguishedName]::new("CN=PHASER360 Project CI Test")
          $req=[System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
            $dn,$rsa,[System.Security.Cryptography.HashAlgorithmName]::SHA256,
            [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
          $oids=[System.Security.Cryptography.OidCollection]::new()
          [void]$oids.Add([System.Security.Cryptography.Oid]::new("1.3.6.1.5.5.7.3.3"))
          $req.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($oids,$false))
          $req.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,$true))
          $cert=$req.CreateSelfSigned(
            [DateTimeOffset]::UtcNow.AddMinutes(-5),
            [DateTimeOffset]::UtcNow.AddYears(1))

          $cer=Join-Path $root "P360_TEST.cer"
          [IO.File]::WriteAllBytes($cer,$cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $pfx=Join-Path $env:RUNNER_TEMP "P360_TEST.pfx"
          $password="P360-CI-EPHEMERAL"
          [IO.File]::WriteAllBytes($pfx,$cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx,$password))

          "P360_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "P360_CERT_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "P360_CERT_PFX_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $text=Get-Content (Join-Path $root "P360_FULL_INSTALL.ps1") -Raw
          $null=[scriptblock]::Create($text)
          Write-Host "P360_FULL_INSTALL_PARSE=PASS"

      - name: Catalog sign audit and package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root="Phaser360\package\P360_FULL_INSTALL"
          $inf=Join-Path $root "P360AudioBundle.inf"
          $infText=Get-Content $inf -Raw

          foreach($token in @(
            "CSAUDIO\ADSP&CTLR_VEN_8086&CTLR_DEV_3198",
            "ACPI\MX98357A",
            "PKEY_AudioEngine_OEMFormat",
            "KSNODETYPE_SPEAKER",
            "DriverVer=10/07/2026,4.2.0.0"
          )) {
            if ($infText -notmatch [regex]::Escape($token)) {
              throw "INF contract missing: $token"
            }
          }

          & $env:P360_INF2CAT "/driver:$root" "/os:10_VB_X64" "/uselocaltime"
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed" }

          $cat=Join-Path $root "P360AudioBundle.cat"
          & $env:P360_SIGNTOOL sign /fd SHA256 /f $env:P360_CERT_PFX /p $env:P360_CERT_PFX_PASSWORD /v $cat
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed" }

          $sig=Get-AuthenticodeSignature $cat
          if (-not $sig.SignerCertificate -or
              $sig.SignerCertificate.Thumbprint -ne $env:P360_CERT_THUMBPRINT) {
            throw "Catalog signer mismatch."
          }

          $m=[regex]::Match($infText,'(?im)^\s*DriverVer\s*=\s*[^,]+,\s*([0-9.]+)\s*$')
          if (-not $m.Success) { throw "DriverVer parse failed" }

          [ordered]@{
            HeadSha="${env:GITHUB_SHA}"
            WorkflowRunId="${env:GITHUB_RUN_ID}"
            DriverVersion=$m.Groups[1].Value
            Provider="PHASER360 Project"
            InstallerMode="FullInstall"
            AdspHardwareId="CSAUDIO\ADSP&CTLR_VEN_8086&CTLR_DEV_3198"
            AmpHardwareId="ACPI\MX98357A"
            ForceBindingApi="UpdateDriverForPlugAndPlayDevices/INSTALLFLAG_FORCE"
            PhysicalAudioTest=$false
            P360SofAudioSha256=(Get-FileHash (Join-Path $root "P360SofAudio.sys") -Algorithm SHA256).Hash.ToLowerInvariant()
            P360Max98357SafeSha256=(Get-FileHash (Join-Path $root "P360Max98357Safe.sys") -Algorithm SHA256).Hash.ToLowerInvariant()
            FirmwareSha256=(Get-FileHash (Join-Path $root "p360-f686.ri") -Algorithm SHA256).Hash.ToLowerInvariant()
            WasapiTestSha256=(Get-FileHash (Join-Path $root "P360_WASAPI_TEST.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
            ForceInstallSha256=(Get-FileHash (Join-Path $root "P360_FORCE_INSTALL.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content (Join-Path $root "PACKAGE_INFO.json") -Encoding utf8

          foreach($required in @(
            "P360AudioBundle.inf","P360AudioBundle.cat",
            "P360SofAudio.sys","P360Max98357Safe.sys","p360-f686.ri",
            "P360_TEST.cer","P360_WASAPI_TEST.exe","P360_FORCE_INSTALL.exe",
            "P360_FULL_INSTALL.ps1","INSTALL_PHASER360_AUDIO.cmd",
            "RESTORE_PHASER360_AUDIO.cmd","PACKAGE_INFO.json","README.txt"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $required) -PathType Leaf)) {
              throw "Full-install package missing: $required"
            }
          }

          foreach($forbidden in @(
            "P360_WAVERT_TEST.exe","P360_AUDIO_GATE.ps1",
            "P360_PRODUCTION_INSTALL.ps1","START_P360_PRODUCTION.cmd"
          )) {
            if (Test-Path -LiteralPath (Join-Path $root $forbidden)) {
              throw "Obsolete test/install surface leaked into full-install ZIP: $forbidden"
            }
          }

          $zip="Phaser360\package\P360_FULL_INSTALL.zip"
          Compress-Archive -Path "$root\*" -DestinationPath $zip -Force

          $verify=Join-Path $env:RUNNER_TEMP "P360_FULL_INSTALL_VERIFY"
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip -DestinationPath $verify -Force
          if (-not (Test-Path (Join-Path $verify "INSTALL_PHASER360_AUDIO.cmd"))) {
            throw "ZIP verification failed."
          }

          Write-Host "P360_FULL_INSTALL_PACKAGE=PASS"
          Write-Host "P360_FORCE_BINDING=PASS"
          Write-Host "P360_FULL_INSTALL_ZIP_SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash)"

      - name: Upload full-install audio driver
        uses: actions/upload-artifact@v4
        with:
          name: P360-FULL-INSTALL-${{ github.sha }}
          path: Phaser360/package/P360_FULL_INSTALL.zip
          if-no-files-found: error
