name: SHAREit single APK - real Android emulator install and launch test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/azure-shareit-android-emulator-test.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  android11_arm_native_bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: 50a5c260-15a0-4aa0-9e02-5f0ad5c23df9
          tenant-id: 779623db-ec2e-495b-9828-85d42baa77ee
          subscription-id: 0ac7a514-32b3-47bf-bf89-e17906b1cc86
      - name: Download APK and original modified split baseline only to ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          export AZURE_STORAGE_KEY="$(az storage account keys list -g rg-chatgpt-azure -n tzn5androidartifacts26 --query '[0].value' -o tsv)"
          mkdir -p /tmp/shareit-emu/splits
          az storage blob download --account-name tzn5androidartifacts26 --container-name apks-private \
            --name output/SHAREit_6.27.58_NoAds_SINGLE_ARM64.apk --file /tmp/shareit-emu/merged.apk --overwrite --only-show-errors
          az storage blob download --account-name tzn5androidartifacts26 --container-name apks-private \
            --name output/SHAREit_6.27.58_NoAds_SPLITS.apks --file /tmp/shareit-emu/splits.apks --overwrite --only-show-errors
          az storage blob download --account-name tzn5androidartifacts26 --container-name apks-private \
            --name output/SHAREit_6.27.58_NoAds_SINGLE_AUDIT.json --file /tmp/shareit-emu/audit.json --overwrite --only-show-errors
          python3 - <<'PY'
          import hashlib,zipfile,json,os
          w='/tmp/shareit-emu/'
          j=json.load(open(w+'audit.json'))
          assert hashlib.file_digest(open(w+'merged.apk','rb'),'sha256').hexdigest()==j['sha256']
          with zipfile.ZipFile(w+'splits.apks') as z:
              for n in z.namelist():
                  assert n.endswith('.apk') and '/' not in n
                  z.extract(n,w+'splits')
          print('APK_FROM_AZURE_VALIDATED_FOR_ANDROID_EMULATOR=PASS')
          PY
      - name: Enable hardware-accelerated Android x86_64 VM on GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Start Android 11 Google APIs emulator with ARM64-native bridge; install and launch
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 840
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -uo pipefail
            DIR=/tmp/shareit-emu
            PKG=com.lenovo.anyshare.gps
            echo "EMULATOR_DEVICE=$(adb shell getprop ro.build.version.release)"
            echo "EMULATOR_ABIS=$(adb shell getprop ro.product.cpu.abilist)"
            echo "ARM_NATIVE_BRIDGE=$(adb shell getprop ro.dalvik.vm.native.bridge)"
            adb install-multiple "$DIR"/splits/*.apk >"$DIR/baseline-install.log" 2>&1
            BASELINE_INSTALL=$?
            echo "BASELINE_INSTALL_RC=$BASELINE_INSTALL"
            BASELINE_PID=missing
            if [ "$BASELINE_INSTALL" -eq 0 ]; then
              adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >"$DIR/baseline-launch.log" 2>&1
              sleep 12
              BASELINE_PID="$(adb shell pidof "$PKG" | tr -d '\r' || true)"
              adb uninstall "$PKG" >/dev/null
            fi
            echo "BASELINE_APP_PID=$BASELINE_PID"
            adb logcat -c || true
            adb install "$DIR/merged.apk" >"$DIR/single-install.log" 2>&1
            SINGLE_INSTALL=$?
            echo "SINGLE_INSTALL_RC=$SINGLE_INSTALL"
            if [ "$SINGLE_INSTALL" -eq 0 ]; then
              adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >"$DIR/single-launch.log" 2>&1
              sleep 18
            fi
            SINGLE_PID="$(adb shell pidof "$PKG" | tr -d '\r' || true)"
            echo "SINGLE_APP_PID=${SINGLE_PID:-missing}"
            adb logcat -d -v time >"$DIR/logcat.log" 2>/dev/null || true
            cat "$DIR/single-install.log"
            cat "$DIR/single-launch.log" 2>/dev/null || true
            grep -E 'FATAL EXCEPTION|AndroidRuntime.*com.lenovo.anyshare.gps' "$DIR/logcat.log" | tail -n 40 || true
            python3 - <<'PY'
            import pathlib,json,re,subprocess
            d=pathlib.Path('/tmp/shareit-emu')
            inst=(d/'single-install.log').read_text(errors='replace')
            bl=(d/'baseline-install.log').read_text(errors='replace')
            launch=(d/'single-launch.log').read_text(errors='replace') if (d/'single-launch.log').exists() else ''
            pid=subprocess.run(['adb','shell','pidof','com.lenovo.anyshare.gps'],capture_output=True,text=True).stdout.strip()
            log=(d/'logcat.log').read_text(errors='replace')
            fatal=bool(re.search(r'FATAL EXCEPTION[^\n]*\n(?:[^\n]*\n){0,12}[^\n]*com\.lenovo\.anyshare\.gps', log))
            obj={'emulator':'Android 11 Google APIs x86_64 with native ARM64 translation',
                 'baseline_split_install':'Success' in bl, 'single_apk_install':'Success' in inst,
                 'single_apk_launch_requested':'Events injected: 1' in launch,
                 'single_apk_pid_alive_after_18s':bool(pid),
                 'fatal_crash_in_log':fatal,
                 'baseline_install_excerpt':bl[-350:],
                 'single_install_excerpt':inst[-500:],
                 'single_launch_excerpt':launch[-400:],
                 'limitations':'Android 11 emulated, not hardware ARM64 Android 16 and no feature-level interactions tested'}
            (d/'emulator-report.json').write_text(json.dumps(obj,indent=2))
            print('ANDROID_RUNTIME_REPORT',json.dumps(obj))
            if not obj['single_apk_install'] or not obj['single_apk_pid_alive_after_18s'] or fatal: raise SystemExit(7)
            print('ANDROID_EMULATOR_INSTALL_AND_LAUNCH=PASS')
            PY
      - name: Store runtime test summary privately in Azure
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/shareit-emu/emulator-report.json ]]; then
            export AZURE_STORAGE_KEY="$(az storage account keys list -g rg-chatgpt-azure -n tzn5androidartifacts26 --query '[0].value' -o tsv)"
            az storage blob upload --account-name tzn5androidartifacts26 --container-name apks-private \
              --name output/SHAREit_6.27.58_NoAds_SINGLE_EMULATOR_TEST.json \
              --file /tmp/shareit-emu/emulator-report.json --overwrite --only-show-errors
            cat /tmp/shareit-emu/emulator-report.json
          else
            echo "ANDROID_EMULATOR_TEST_REPORT_UNAVAILABLE"
          fi
      - if: always()
        run: az logout || true
