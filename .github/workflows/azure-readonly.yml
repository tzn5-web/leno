name: Azure inventory - read only

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: 'Existing Azure resource group to inspect'
        required: true
        type: string
        default: 'rg-phaser360-driverlab'
      vm_name:
        description: 'Existing VM to inspect (leave empty to skip)'
        required: false
        type: string
        default: 'int34d2-lab'
  workflow_call:
    inputs:
      resource_group:
        required: true
        type: string
      vm_name:
        required: false
        type: string
        default: ''
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: azure-inventory-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect existing Azure resources without writes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check credentials are configured
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub Actions secret: $key. See .azure/pipeline-setup.md" >&2
              exit 1
            fi
          done
      - name: Azure OIDC login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Inventory (read-only Azure CLI)
        shell: bash
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          VM_NAME: ${{ inputs.vm_name }}
        run: |
          set -euo pipefail
          az account show --query '{name:name,tenantId:tenantId}' --output json
          az group show --name "$RESOURCE_GROUP" --query '{name:name,location:location}' --output json
          if [ -n "$VM_NAME" ]; then
            az vm show --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" --query '{name:name,location:location,provisioningState:provisioningState}' --output json
            az vm get-instance-view --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" --query 'statuses[?starts_with(code, `PowerState/`)].displayStatus | [0]' --output tsv
          fi
          echo 'READ_ONLY_COMPLETE: no VM start, no writes, no deployment.'
