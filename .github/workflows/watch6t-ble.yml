name: Watch6T BLE uploader
on:
  push:
    branches: [watch6t-gloryfit-analysis]
    paths:
      - 'projects/watch6t-gloryfit/uploader/**'
      - '.github/workflows/watch6t-ble.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/watch6t-gloryfit/uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional BLE package
        run: python -m pip install -r requirements.txt
      - name: Native BIN codec and simulated uploader tests
        run: python -m unittest discover -s tests -v
      - name: Bytecode compile
        run: python -m compileall -q .

  windows-portable:
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/watch6t-gloryfit/uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --name Watch6T-BLE watch6t_ble.py
      - uses: actions/upload-artifact@v4
        with:
          name: Watch6T-BLE-Windows
          path: projects/watch6t-gloryfit/uploader/dist/Watch6T-BLE.exe
          if-no-files-found: error
          retention-days: 14
