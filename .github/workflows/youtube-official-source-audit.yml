name: YouTube 21.40.5 provenance audit
on:
  push:
    branches: [codex/vanced-official-only-21405]
    paths: ['VancedIOS/Official21/**','.github/workflows/youtube-official-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (no external binary executed)
        run: python3 -m unittest discover -s VancedIOS/Official21/tests -v
      - name: Fetch source disclosed by open-source publisher
        env:
          VANILLA_URL: https://www.dropbox.com/scl/fi/i6qurxkwjn8xw8exmtaiw/com.google.ios.youtube-21.40.5-eeveedecrypter.ipa?rlkey=mh42ixectfcuudxaht5t4uh35&dl=1
        run: |
          mkdir -p reports
          curl --fail --location --retry 2 --max-time 420 "$VANILLA_URL" -o reports/candidate.ipa
          test "$(stat -c%s reports/candidate.ipa)" -gt 10000000
          sha256sum reports/candidate.ipa > reports/SHA256.txt
      - name: Audit IPA without executing it
        run: python3 VancedIOS/Official21/verify_source.py reports/candidate.ipa --out reports/report.json
      - name: Defensive static inspection of app code and permissions
        run: python3 VancedIOS/Official21/security_scan.py reports/candidate.ipa --out reports/security_static.json
      - name: ClamAV known-malware scan (signature detection only)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout | tee reports/clamav_update.txt
          clamscan --version | tee reports/clamav_version.txt
          set +e
          clamscan --scan-archive=yes --max-filesize=512M --max-scansize=2048M \\
            --max-files=50000 reports/candidate.ipa > reports/clamav_result.txt 2>&1
          code=$?
          set -e
          cat reports/clamav_result.txt
          if [ "$code" -ne 0 ]; then
            echo "BLOCKED: antivirus detected a problem or scanner error ($code)"
            exit "$code"
          fi
          echo "Signature scan completed; result is not proof of no malware."
      - name: Upload ONLY audit report (no third-party IPA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-21405-candidate-source-audit
          path: |
            reports/report.json
            reports/SHA256.txt
            reports/security_static.json
            reports/clamav_result.txt
            reports/clamav_version.txt
            reports/clamav_update.txt
          if-no-files-found: warn

  build-local-profile:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build native iOS local profile
        run: |
          mkdir -p VancedIOS/Official21/artifacts
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang -arch arm64 -dynamiclib -fobjc-arc -fblocks -isysroot "$sdk" \
            -miphoneos-version-min=17.0 -O2 -Wall -Wextra -Werror \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            VancedIOS/Official21/LocalProfile.m -Wl,-install_name,@rpath/VancedLocalProfile.dylib \
            -o VancedIOS/Official21/artifacts/VancedLocalProfile.dylib
          xcrun codesign --force --sign - VancedIOS/Official21/artifacts/VancedLocalProfile.dylib
          xcrun codesign --verify --strict VancedIOS/Official21/artifacts/VancedLocalProfile.dylib
          shasum -a 256 VancedIOS/Official21/artifacts/VancedLocalProfile.dylib > VancedIOS/Official21/artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vanced-local-only-arm64-module
          path: VancedIOS/Official21/artifacts/
          if-no-files-found: error
