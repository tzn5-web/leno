name: Compile Xiaomi LatinIME Glass and Emoji extension
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Optional direct HTTPS URL to your original LatinIME.apk for full APK build'
        type: string
        required: false
  push:
    branches: [fix/s24-original-latinime-20261109]
    paths:
      - 'projects/s24-latinime-original/addon/**'
      - '.github/workflows/s24-latinime-glass-emoji-addon.yml'
  pull_request:
    paths:
      - 'projects/s24-latinime-original/addon/**'
      - '.github/workflows/s24-latinime-glass-emoji-addon.yml'
permissions:
  contents: read
jobs:
  compile-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK compiler available
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Glass + advanced emoji classes2.dex
        shell: bash
        run: |
          set -euo pipefail
          SRC="projects/s24-latinime-original/addon"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p build/glass-classes build/glass-dex
          find "$SRC/stubs" "$SRC/src" -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -source 17 -target 17 -cp "$SDK/platforms/android-35/android.jar" -d build/glass-classes
          mapfile -d '' ADDON_CLASSES < <(find build/glass-classes/dev/tzn5/glass -name '*.class' -print0)
          "$SDK/build-tools/35.0.0/d8" --min-api 26 --lib "$SDK/platforms/android-35/android.jar" --output build/glass-dex "${ADDON_CLASSES[@]}"
          test -s build/glass-dex/classes.dex
          mv build/glass-dex/classes.dex build/glass-dex/classes2.dex
      - name: Verify no networking, logging or key-history code in add-on
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'INTERNET|HttpURLConnection|java.net.|android.util.Log|SQLite|FileOutputStream|TypedTextHistory|AccessibilityService' projects/s24-latinime-original/addon/src; then
            echo "Unexpected privacy-sensitive API in Glass add-on"; exit 1
          fi
          echo 'PASS: appearance settings only, no key history/network API in new code'
      - name: Publish addon DEX for local repack of original Xiaomi APK
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-Glass-Emoji-classes2
          path: build/glass-dex/classes2.dex
          if-no-files-found: error

      - name: Download supplied Xiaomi original and rebuild complete signed Glass+Emoji APK
        if: ${{ inputs.apk_url != '' }}
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_URL" == https://* ]] || { echo "HTTPS APK URL required"; exit 1; }
          curl --fail --location --retry 2 --max-time 300 --output build/LatinIME.apk "$SOURCE_URL"
          unzip -tq build/LatinIME.apk
          python3 -m pip install --quiet 'Pillow>=10,<13'
          python3 projects/s24-latinime-original/prepare_original.py build/LatinIME.apk build/sanitized.apk
          python3 projects/s24-latinime-original/build_glass_apk.py build/sanitized.apk build/glass-dex/classes2.dex build/unsigned-glass.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/build-tools/35.0.0/zipalign" -f -p 4 build/unsigned-glass.apk build/aligned-glass.apk
          keytool -genkeypair -noprompt -keystore build/temporary.keystore -storepass changeit -alias s24 -keypass changeit -keyalg RSA -keysize 3072 -validity 365 -dname 'CN=S24 Glass Test' >/dev/null 2>&1
          "$SDK/build-tools/35.0.0/apksigner" sign --min-sdk-version 30 --ks build/temporary.keystore --ks-key-alias s24 --ks-pass pass:changeit --key-pass pass:changeit --out build/Xiaomi_S24_Glass_Emoji_Test.apk build/aligned-glass.apk
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/Xiaomi_S24_Glass_Emoji_Test.apk
      - name: Publish full installable Glass and Emoji APK
        if: ${{ inputs.apk_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-S24-Glass-Emoji-full-apk
          path: build/Xiaomi_S24_Glass_Emoji_Test.apk
          if-no-files-found: error
