name: S24 Glass + Emoji UI Smoke
on:
  workflow_dispatch:
  push:
    branches: [feature/s24-glass-emoji-20261109]
    paths: ['.github/workflows/s24-glass-emoji-ui-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile test-only IME with real Glass and Emoji source
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          JAR="$SDK/platforms/android-35/android.jar"
          P="projects/s24-latinime-glass/src/main/java"
          mkdir -p build/ui/src/com/android/inputmethod/latin \
                   build/ui/src/harness build/ui/res/xml build/ui/stubs build/ui/classes build/ui/dex
          cat > build/ui/src/com/android/inputmethod/latin/LatinIME.java <<'JAVA'
          package com.android.inputmethod.latin;
          import android.inputmethodservice.InputMethodService;
          import android.view.View;
          import android.widget.TextView;
          public class LatinIME extends InputMethodService {
            @Override public View onCreateInputView() {
              TextView view = new TextView(this);
              view.setText("Original keyboard UI fixture");
              view.setBackgroundColor(0xff242d38);
              view.setTextColor(-1);
              view.setHeight(220);
              return view;
            }
          }
          JAVA
          cat > build/ui/src/harness/DemoActivity.java <<'JAVA'
          package harness;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.EditText;
          public class DemoActivity extends Activity {
            public void onCreate(Bundle b) {
              super.onCreate(b);
              EditText e=new EditText(this);
              e.setHint("Glass emoji tester");
              e.setSingleLine(true);
              setContentView(e);
              e.requestFocus();
              e.postDelayed(()->((InputMethodManager)getSystemService(
                Context.INPUT_METHOD_SERVICE)).showSoftInput(e,0),800);
            }
          }
          JAVA
          cat > build/ui/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="dev.tzn5.glassuitest">
            <application android:label="Glass UI Test" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:allowBackup="false">
              <service android:name="com.android.inputmethod.latin.GlassIME" android:exported="true" android:permission="android.permission.BIND_INPUT_METHOD">
                <intent-filter><action android:name="android.view.InputMethod"/></intent-filter>
                <meta-data android:name="android.view.im" android:resource="@xml/method"/>
              </service>
              <activity android:name="com.android.inputmethod.latin.setup.GlassActivity" android:exported="true"/>
              <activity android:name="harness.DemoActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          XML
          cat > build/ui/res/xml/method.xml <<'XML'
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
            android:settingsActivity="com.android.inputmethod.latin.setup.GlassActivity"/>
          XML
          javac -encoding UTF-8 -cp "$JAR" -d build/ui/stubs build/ui/src/com/android/inputmethod/latin/LatinIME.java
          javac -encoding UTF-8 -cp "$JAR:build/ui/stubs" -d build/ui/classes \
            "$P/com/android/inputmethod/latin/GlassIME.java" \
            "$P/com/android/inputmethod/latin/GlassEmojiPanel.java" \
            "$P/com/android/inputmethod/latin/setup/GlassActivity.java" \
            build/ui/src/harness/DemoActivity.java
          "$SDK/build-tools/35.0.0/d8" --min-api 30 --lib "$JAR" --output build/ui/dex \
             $(find build/ui/stubs build/ui/classes -name '*.class' | sort)
          "$SDK/build-tools/35.0.0/aapt2" compile -o build/ui/resources.zip build/ui/res/xml/method.xml
          "$SDK/build-tools/35.0.0/aapt2" link -o build/ui/raw.apk -I "$JAR" --manifest build/ui/AndroidManifest.xml \
            --min-sdk-version 30 --target-sdk-version 35 build/ui/resources.zip
          (cd build/ui/dex && zip -q ../raw.apk classes.dex)
          "$SDK/build-tools/35.0.0/zipalign" -f 4 build/ui/raw.apk build/ui/aligned.apk
          keytool -genkeypair -noprompt -keystore build/ui/test.jks -storepass changeit \
             -alias test -keypass changeit -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=UI Test' >/dev/null 2>&1
          "$SDK/build-tools/35.0.0/apksigner" sign --ks build/ui/test.jks --ks-key-alias test \
             --ks-pass pass:changeit --key-pass pass:changeit --out build/ui/smoke.apk build/ui/aligned.apk
          "$SDK/build-tools/35.0.0/apksigner" verify build/ui/smoke.apk
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb install -r build/ui/smoke.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell ime enable dev.tzn5.glassuitest/com.android.inputmethod.latin.GlassIME
            adb shell ime set dev.tzn5.glassuitest/com.android.inputmethod.latin.GlassIME
            adb shell am start -n dev.tzn5.glassuitest/harness.DemoActivity
            sleep 6
            adb shell input tap 170 180
            sleep 2
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml build/ui/open.xml >/dev/null
            python3 - <<'PY'
            import re,subprocess,xml.etree.ElementTree as ET
            nodes=[x.attrib for x in ET.parse('build/ui/open.xml').iter('node')]
            buttons=[n for n in nodes if 'Emoji' in n.get('text','') or 'Emoji' in n.get('content-desc','')]
            assert buttons,'Emoji button invisible — Glass input view not attached'
            x1,y1,x2,y2=map(int,re.findall(r'\d+',buttons[0]['bounds']))
            subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)
            print('PASS: Emoji button visible and tapped in Android emulator')
            PY
            sleep 2
            adb shell uiautomator dump /sdcard/emoji.xml >/dev/null
            adb pull /sdcard/emoji.xml build/ui/emoji.xml >/dev/null
            python3 - <<'PY'
            import xml.etree.ElementTree as ET
            texts=[n.attrib.get('text','') for n in ET.parse('build/ui/emoji.xml').iter('node')]
            assert any('Caut' in s or 'Fețe' in s or 'Toate' in s for s in texts), 'Emoji browser not shown'
            print('PASS: emoji categories/search UI displayed')
            PY
            adb shell am start -n dev.tzn5.glassuitest/com.android.inputmethod.latin.setup.GlassActivity
            sleep 2
            adb shell uiautomator dump /sdcard/settings.xml >/dev/null
            adb pull /sdcard/settings.xml build/ui/settings.xml >/dev/null
            python3 - <<'PY'
            import xml.etree.ElementTree as ET
            texts=[n.attrib.get('text','') for n in ET.parse('build/ui/settings.xml').iter('node')]
            assert any('Opacitate' in s for s in texts), 'Glass slider not shown'
            print('PASS: settings and opacity slider displayed')
            PY
      - name: Upload UI diagnostics when failing
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Emoji-UI-smoke-debug
          path: build/ui/*.xml
          if-no-files-found: ignore
