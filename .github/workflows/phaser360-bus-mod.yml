name: Build Phaser360 Gemini Lake bus mod

on:
  push:
    branches:
      - phaser360-audio-bus-mod
    paths:
      - 'Phaser360/bus-mod/**'
      - '.github/workflows/phaser360-bus-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Verify preinstalled SDK and WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0'
          $wdk = 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km'
          if (!(Test-Path $sdk)) { throw "Windows SDK 26100 missing: $sdk" }
          if (!(Test-Path $wdk)) { throw "WDK 26100 kernel headers missing: $wdk" }
          Write-Host "SDK OK: $sdk"
          Write-Host "WDK KM headers OK: $wdk"

      - name: Clone pinned CoolStar bus and apply Phaser360 patch
        shell: pwsh
        run: |
          ./Phaser360/bus-mod/scripts/APPLY_PATCH.ps1

      - name: Build x64 Release driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proj = Join-Path $env:GITHUB_WORKSPACE '_upstream\sklhdaudbus\sklhdaudbus\sklhdaudbus.vcxproj'
          msbuild $proj /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.26100.0 /p:SignMode=Off
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }

      - name: Stage built INF and SYS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE '_upstream\sklhdaudbus'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'P360_BUS_PACKAGE'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $builtDir = Join-Path $src 'sklhdaudbus\x64\Release'
          $sys = Join-Path $builtDir 'sklhdaudbus.sys'
          $inf = Join-Path $builtDir 'sklhdaudbus.inf'
          if (!(Test-Path $sys)) { throw "Built SYS missing: $sys" }
          if (!(Test-Path $inf)) { throw "Stamped INF missing: $inf" }

          Copy-Item $sys (Join-Path $stage 'sklhdaudbus.sys') -Force
          Copy-Item $inf (Join-Path $stage 'sklhdaudbus.inf') -Force
          Copy-Item './Phaser360/bus-mod/scripts/INSTALL_P360_BUS_MOD.ps1' $stage -Force
          Copy-Item './Phaser360/bus-mod/scripts/ROLLBACK_P360_BUS_MOD.ps1' $stage -Force
          Copy-Item './Phaser360/bus-mod/scripts/VERIFY_P360_BUS_MOD.ps1' $stage -Force
          Copy-Item './Phaser360/bus-mod/scripts/START_INSTALL_P360_BUS_MOD.cmd' $stage -Force
          Copy-Item './Phaser360/bus-mod/scripts/START_VERIFY_P360_BUS_MOD.cmd' $stage -Force
          Copy-Item './Phaser360/bus-mod/scripts/START_ROLLBACK_P360_BUS_MOD.cmd' $stage -Force
          Copy-Item './Phaser360/bus-mod/README.md' $stage -Force
          Copy-Item './Phaser360/bus-mod/PATCH_APPLIED.diff' $stage -Force

      - name: Static audit staged package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'P360_BUS_PACKAGE'

          foreach ($name in @(
            'INSTALL_P360_BUS_MOD.ps1',
            'ROLLBACK_P360_BUS_MOD.ps1',
            'VERIFY_P360_BUS_MOD.ps1'
          )) {
            $path = Join-Path $stage $name
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell parser errors in $name"
            }
            Write-Host "PS5.1 PARSE OK: $name"
          }

          $inf = Get-Content (Join-Path $stage 'sklhdaudbus.inf') -Raw
          if ($inf -notmatch 'PCI\\VEN_8086&DEV_3198&CC_0401') {
            throw 'Gemini Lake 3198 INF target missing.'
          }

          $diff = Get-Content (Join-Path $stage 'PATCH_APPLIED.diff') -Raw
          if ($diff -notmatch '\[P360\] IRQ translated:') {
            throw 'IRQ resource diagnostics patch missing.'
          }
          if ($diff -match 'P360AUDIO\\ADSP_GEMINILAKE') {
            throw 'Obsolete custom DSP compatible ID reappeared.'
          }
          if ($diff -match 'diff --git a/sklhdaudbus/buspdo.cpp') {
            throw 'buspdo.cpp must remain upstream-clean in the minimal bus patch.'
          }

          Write-Host 'STATIC_GATE=PASS'

      - name: Test-sign SYS then generate and sign catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'P360_BUS_PACKAGE'
          $inf2cat = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86\Inf2Cat.exe'
          $signtool = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe'

          if (!(Test-Path $inf2cat)) { throw "Inf2Cat.exe not found: $inf2cat" }
          if (!(Test-Path $signtool)) { throw "signtool.exe not found: $signtool" }

          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=PHASER360 Test Driver' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(2)
          $cerPath = Join-Path $stage 'PHASER360_TEST_DRIVER.cer'
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

          & $signtool sign /v /fd SHA256 /sha1 $cert.Thumbprint /s My (Join-Path $stage 'sklhdaudbus.sys')
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for SYS" }

          & $inf2cat /driver:$stage /os:10_X64
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed: $LASTEXITCODE" }

          & $signtool sign /v /fd SHA256 /sha1 $cert.Thumbprint /s My (Join-Path $stage 'sklhdaudbus.cat')
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for CAT" }

          @(
            "SIGN_MODE=TEST"
            "SIGNER_SUBJECT=$($cert.Subject)"
            "SIGNER_THUMBPRINT=$($cert.Thumbprint)"
            "CERT_FILE=PHASER360_TEST_DRIVER.cer"
            "TARGET_REQUIREMENT=Windows TestSigning enabled"
          ) | Set-Content -LiteralPath (Join-Path $stage 'SIGNATURE_STATUS.txt') -Encoding UTF8

          Get-FileHash (Join-Path $stage 'sklhdaudbus.sys') -Algorithm SHA256 |
            Format-List | Out-File (Join-Path $stage 'SHA256.txt')
          Get-FileHash (Join-Path $stage 'sklhdaudbus.cat') -Algorithm SHA256 |
            Format-List | Out-File (Join-Path $stage 'SHA256.txt') -Append

      - name: Upload driver package
        uses: actions/upload-artifact@v4
        with:
          name: P360_GEMINILAKE_BUS_MOD_TESTSIGNED
          path: P360_BUS_PACKAGE
          if-no-files-found: error
