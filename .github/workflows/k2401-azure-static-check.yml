name: K2401 Azure pipeline static validation
on:
  push:
    branches: [feature/k2401-evo-launcher]
    paths:
      - 'projects/k2401-evo-launcher/scripts/**'
      - '.github/workflows/k2401-azure-emulator.yml'
      - '.github/workflows/k2401-evo-launcher.yml'
      - '.github/workflows/k2401-azure-static-check.yml'
permissions:
  contents: read
jobs:
  powershell-parser:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse Azure Windows PowerShell source without executing it
        shell: pwsh
        run: |
          $script = 'projects/k2401-evo-launcher/scripts/azure-vm-emulator.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
          if ($null -eq $ast -or $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host ("PARSE_ERROR line {0}, column {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
            throw 'POWERSHELL_PARSE_FAIL'
          }
          Write-Host 'POWERSHELL_PARSE_PASS'
  yaml-and-bash:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloud Shell OIDC bootstrap syntax
        run: bash -n projects/k2401-evo-launcher/scripts/bootstrap-azure-oidc.sh
      - name: Install actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate Azure and emulator workflow YAML
        run: |
          actionlint -color .github/workflows/k2401-azure-emulator.yml .github/workflows/k2401-evo-launcher.yml .github/workflows/k2401-azure-static-check.yml
          echo 'WORKFLOW_STATIC_VALIDATION=PASS'
