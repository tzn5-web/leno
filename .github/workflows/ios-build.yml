name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        run: |
          xcrun swift Scripts/GenerateAppIcon.swift Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test -s Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: V5 architecture audit
        run: |
          set -euo pipefail

          grep -q 'CFBundleDisplayName: YoutubeVcd' project.yml
          grep -q 'UIBackgroundModes:' project.yml
          grep -q 'MARKETING_VERSION: "0.5.0"' project.yml

          grep -q 'pipedapi.kavin.rocks' Leno/StreamResolver.swift
          grep -q 'invidious.nerdvpn.de' Leno/StreamResolver.swift
          grep -q 'timeoutIntervalForRequest = 4' Leno/StreamResolver.swift
          grep -q 'videoOnly != true' Leno/StreamResolver.swift
          grep -q 'payload.paid != true' Leno/StreamResolver.swift
          grep -q 'payload.premium != true' Leno/StreamResolver.swift

          grep -q 'AVAudioSession' Leno/NativePlaybackController.swift
          grep -q 'MPRemoteCommandCenter' Leno/NativePlaybackController.swift
          grep -q 'audiovisualBackgroundPlaybackPolicy' Leno/NativePlaybackController.swift
          grep -q 'continuesIfPossible' Leno/NativePlaybackController.swift
          grep -q '7_000_000_000' Leno/NativePlaybackController.swift
          grep -q 'onWebFallback' Leno/NativePlaybackController.swift

          grep -q 'AVPlayerViewController' Leno/NativePlayerView.swift
          grep -q 'allowsPictureInPicturePlayback = true' Leno/NativePlayerView.swift
          grep -q 'canStartPictureInPictureAutomaticallyFromInline = true' Leno/NativePlayerView.swift

          grep -q 'messageHandlers' Leno/NavigationBridgeScript.swift
          grep -q 'openVideo' Leno/NavigationBridgeScript.swift
          grep -q 'NavigationBridgeScript.source' Leno/YouTubeWebView.swift
          grep -q 'name: "openVideo"' Leno/YouTubeWebView.swift
          grep -q 'interceptVideoURL' Leno/YouTubeWebView.swift

          if grep -q 'YouTubeKit' project.yml; then
            echo "YouTubeKit must not be in the active build."
            exit 1
          fi

          if grep -q 'Response.prototype.json' Leno/AdBlockScript.swift; then
            echo "Player JSON interception must not be active."
            exit 1
          fi

          if grep -q 'JSON.parse = function' Leno/AdBlockScript.swift; then
            echo "Global JSON.parse hook is forbidden."
            exit 1
          fi

          if grep -q 'TextField("Search YouTube"' Leno/YouTubeView.swift; then
            echo "Duplicate native search bar must not exist."
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/AnalyzeData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            analyze | tee analyze.log

      - name: Simulator smoke test
        run: |
          set -euo pipefail

          SIM_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime in data.get("devices", {}).values():
              for device in runtime:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')"

          echo "Using simulator: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/SimulatorData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee simulator-build.log

          SIM_APP="build/SimulatorData/Build/Products/Debug-iphonesimulator/YoutubeVcd.app"
          test -d "$SIM_APP"

          xcrun simctl install "$SIM_UDID" "$SIM_APP"
          xcrun simctl launch "$SIM_UDID" com.tzn5web.leno | tee simulator-launch.log

          sleep 12
          xcrun simctl io "$SIM_UDID" screenshot simulator-smoke.png

          xcrun simctl spawn "$SIM_UDID" log show \
            --last 3m \
            --style compact \
            --predicate 'process == "YoutubeVcd"' \
            > simulator-runtime.log || true

          if grep -Eqi 'fatal error|uncaught exception|termination reason|crash' simulator-runtime.log; then
            echo "Potential runtime crash marker detected."
            cat simulator-runtime.log
            exit 1
          fi

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee build.log

      - name: Audit built app metadata
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/YoutubeVcd.app"
          PLIST="$APP_PATH/Info.plist"

          test -d "$APP_PATH"
          test -f "$PLIST"

          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          BACKGROUND_MODE="$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"

          test "$DISPLAY_NAME" = "YoutubeVcd"
          test "$BUNDLE_ID" = "com.tzn5web.leno"
          test "$BACKGROUND_MODE" = "audio"
          test "$VERSION" = "0.5.0"

          find "$APP_PATH" -maxdepth 1 -iname '*AppIcon*' -print \
            | tee app-icon-files.log

          test -s Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/YoutubeVcd.app"
          test -d "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          ditto -c -k --sequesterRsrc --keepParent \
            Payload YoutubeVcd-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: YoutubeVcd-v5-native-media-ipa
          path: YoutubeVcd-unsigned.ipa
          if-no-files-found: error

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-smoke
          path: |
            simulator-smoke.png
            simulator-launch.log
            simulator-runtime.log
            simulator-build.log
            app-icon-files.log
          if-no-files-found: ignore

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: |
            analyze.log
            build.log
            simulator-build.log
            simulator-launch.log
            simulator-runtime.log
            app-icon-files.log
          if-no-files-found: ignore
