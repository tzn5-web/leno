name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        run: |
          xcrun swift Scripts/GenerateAppIcon.swift Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test -s Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: WebKit V4 source audit
        run: |
          set -euo pipefail

          grep -q 'MARKETING_VERSION: "0.4.4"' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "9"' project.yml
          grep -q 'UIBackgroundModes:' project.yml
          grep -q -- '- audio' project.yml

          test ! -f Leno/BackgroundAudioHandoff.swift

          grep -q '__YOUTUBE_VCD_PLAYBACK_BRIDGE_V4__' Leno/PlaybackBridgeScript.swift
          grep -q 'blockedLifecycleEvents' Leno/PlaybackBridgeScript.swift
          grep -q 'nativeHiddenDescriptor' Leno/PlaybackBridgeScript.swift
          grep -q 'spoofDocumentProperty' Leno/PlaybackBridgeScript.swift
          grep -q 'document.hasFocus = () => true' Leno/PlaybackBridgeScript.swift
          grep -q 'userPauseUntil' Leno/PlaybackBridgeScript.swift
          grep -q 'transitionRecoveryUntil' Leno/PlaybackBridgeScript.swift
          grep -q 'nativeBackground' Leno/PlaybackBridgeScript.swift
          grep -q 'findWatchVideo' Leno/PlaybackBridgeScript.swift
          grep -q 'html5-main-video' Leno/PlaybackBridgeScript.swift
          grep -q 'navigator.audioSession.type' Leno/PlaybackBridgeScript.swift
          grep -q 'setActionHandler' Leno/PlaybackBridgeScript.swift
          grep -q 'setPositionState' Leno/PlaybackBridgeScript.swift
          grep -q 'webkitpresentationmodechanged' Leno/PlaybackBridgeScript.swift
          grep -q 'event.stopPropagation()' Leno/PlaybackBridgeScript.swift
          grep -q 'enterBackgroundCall' Leno/PlaybackBridgeScript.swift
          grep -q 'resumeForegroundCall' Leno/PlaybackBridgeScript.swift

          grep -q 'AVAudioSession' Leno/YouTubeSession.swift
          grep -q 'MPRemoteCommandCenter' Leno/YouTubeSession.swift
          grep -q 'applicationWillResignActive' Leno/YouTubeSession.swift
          grep -q 'enterBackgroundCall' Leno/YouTubeSession.swift
          grep -q 'resumeForegroundCall' Leno/YouTubeSession.swift

          grep -q 'applicationWillResignActive()' Leno/YouTubeView.swift
          grep -q 'allowsPictureInPictureMediaPlayback = true' Leno/YouTubeWebView.swift
          grep -q 'allowsInlineMediaPlayback = true' Leno/YouTubeWebView.swift
          grep -Fq 'mediaTypesRequiringUserActionForPlayback = []' Leno/YouTubeWebView.swift

          if grep -q 'BackgroundAudioHandoff' project.yml Leno/*.swift; then
            echo "AVPlayer handoff must not return."
            exit 1
          fi

          if grep -q 'mediaCandidate' Leno/*.swift; then
            echo "Direct media URL handoff must not return."
            exit 1
          fi

          if grep -q 'StreamResolver.swift' project.yml; then
            echo "External stream resolver must stay inactive."
            exit 1
          fi

          if grep -q 'YouTubeKit' project.yml; then
            echo "YouTubeKit must stay inactive."
            exit 1
          fi

          if grep -q 'setAllMediaPlaybackSuspended' Leno/YouTubeSession.swift; then
            echo "Manual WebKit suspension is forbidden in V4."
            exit 1
          fi

          if grep -Fq 'messageHandlers?.mediaState' Leno/AdBlockScript.swift; then
            echo "AdBlockScript must not compete for media-state ownership."
            exit 1
          fi

          if grep -Fq 'document.querySelector("video")' Leno/YouTubeSession.swift; then
            echo "Native transport must use the active-video bridge, not first-video selection."
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/AnalyzeData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            analyze | tee analyze.log

      - name: Simulator compile smoke
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee simulator-build.log

          test -d build/SimulatorData/Build/Products/Debug-iphonesimulator/YoutubeVcd.app

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee build.log

      - name: Audit built app metadata
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/YoutubeVcd.app"
          PLIST="$APP_PATH/Info.plist"

          test -d "$APP_PATH"
          test -f "$PLIST"

          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          BACKGROUND_MODE="$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"

          test "$DISPLAY_NAME" = "YoutubeVcd"
          test "$BUNDLE_ID" = "com.tzn5web.leno"
          test "$BACKGROUND_MODE" = "audio"
          test "$VERSION" = "0.4.4"
          test "$BUILD" = "9"

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/YoutubeVcd.app"
          test -d "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          ditto -c -k --sequesterRsrc --keepParent \
            Payload YoutubeVcd-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: YoutubeVcd-v4-researched-webkit-background-ipa
          path: YoutubeVcd-unsigned.ipa
          if-no-files-found: error

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-evidence
          path: |
            analyze.log
            simulator-build.log
            build.log
          if-no-files-found: ignore
