name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        run: |
          xcrun swift Scripts/GenerateAppIcon.swift Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test -s Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Native handoff source audit
        run: |
          set -euo pipefail

          grep -q 'CFBundleDisplayName: YoutubeVcd' project.yml
          grep -q 'UIBackgroundModes:' project.yml
          grep -q 'MARKETING_VERSION: "0.4.3"' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "8"' project.yml

          grep -q 'allowsPictureInPictureMediaPlayback = true' Leno/YouTubeWebView.swift
          grep -q 'allowsAirPlayForMediaPlayback = true' Leno/YouTubeWebView.swift
          grep -Fq 'mediaTypesRequiringUserActionForPlayback = []' Leno/YouTubeWebView.swift
          grep -q 'name: "mediaState"' Leno/YouTubeWebView.swift
          grep -q 'name: "mediaCandidate"' Leno/YouTubeWebView.swift

          grep -q 'publishMediaCandidate' Leno/AdBlockScript.swift
          grep -q 'audio/mp4' Leno/AdBlockScript.swift
          grep -q 'hlsManifestUrl' Leno/AdBlockScript.swift

          grep -q '__YOUTUBE_VCD_PLAYBACK_BRIDGE__' Leno/PlaybackBridgeScript.swift
          grep -q 'prepareNativeHandoff' Leno/PlaybackBridgeScript.swift
          grep -q 'resumeFromNative' Leno/PlaybackBridgeScript.swift
          grep -q 'videoScore' Leno/PlaybackBridgeScript.swift

          grep -q 'final class BackgroundAudioHandoff' Leno/BackgroundAudioHandoff.swift
          grep -q 'AVPlayer()' Leno/BackgroundAudioHandoff.swift
          grep -q 'continuesIfPossible' Leno/BackgroundAudioHandoff.swift

          grep -q 'AVAudioSession' Leno/YouTubeSession.swift
          grep -q 'MPRemoteCommandCenter' Leno/YouTubeSession.swift
          grep -q 'beginNativeHandoffIfPossible' Leno/YouTubeSession.swift
          grep -q 'prepareNativeHandoffCall' Leno/YouTubeSession.swift
          grep -q 'setAllMediaPlaybackSuspended' Leno/YouTubeSession.swift
          grep -q 'observeApplicationLifecycle' Leno/YouTubeSession.swift

          if grep -Fq 'HTMLMediaElement.prototype.pause' Leno/PlaybackBridgeScript.swift; then
            echo "Global HTMLMediaElement.pause patch must not return."
            exit 1
          fi

          if grep -Fq 'messageHandlers?.mediaState' Leno/AdBlockScript.swift; then
            echo "AdBlockScript must not compete for media-state reporting."
            exit 1
          fi

          if grep -q 'scenePhase' Leno/YouTubeView.swift; then
            echo "SwiftUI scenePhase must not duplicate lifecycle notifications."
            exit 1
          fi

          if grep -q 'StreamResolver.swift' project.yml; then
            echo "External stream resolver must not be active."
            exit 1
          fi

          if grep -q 'YouTubeKit' project.yml; then
            echo "YouTubeKit must not be an active dependency."
            exit 1
          fi

          if grep -q 'JSON.parse = function' Leno/AdBlockScript.swift; then
            echo "Global JSON.parse hook is forbidden."
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/AnalyzeData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            analyze | tee analyze.log

      - name: Simulator compile smoke
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee simulator-build.log

          SIM_APP="build/SimulatorData/Build/Products/Debug-iphonesimulator/YoutubeVcd.app"
          test -d "$SIM_APP"

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee build.log

      - name: Audit built app metadata
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/YoutubeVcd.app"
          PLIST="$APP_PATH/Info.plist"

          test -d "$APP_PATH"
          test -f "$PLIST"

          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          BACKGROUND_MODE="$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"

          test "$DISPLAY_NAME" = "YoutubeVcd"
          test "$BUNDLE_ID" = "com.tzn5web.leno"
          test "$BACKGROUND_MODE" = "audio"
          test "$VERSION" = "0.4.3"
          test "$BUILD" = "8"

          find "$APP_PATH" -maxdepth 1 -iname '*AppIcon*' -print \
            | tee app-icon-files.log

          test -s Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/YoutubeVcd.app"
          test -d "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          ditto -c -k --sequesterRsrc --keepParent \
            Payload YoutubeVcd-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: YoutubeVcd-v3-native-background-handoff-ipa
          path: YoutubeVcd-unsigned.ipa
          if-no-files-found: error

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-evidence
          path: |
            analyze.log
            build.log
            simulator-build.log
            app-icon-files.log
          if-no-files-found: ignore
