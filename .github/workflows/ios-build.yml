name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        run: |
          xcrun swift Scripts/GenerateAppIcon.swift Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test -s Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: WebKit V4 structural source audit
        run: |
          set -euo pipefail
          python3 Scripts/audit_playback_v4.py
          node --check build/source-audit/PlaybackBridgeScript.js
          node --check build/source-audit/AdBlockScript.js

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/AnalyzeData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            analyze | tee analyze.log

      - name: Simulator compile smoke
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee simulator-build.log

          test -d build/SimulatorData/Build/Products/Debug-iphonesimulator/YoutubeVcd.app

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee build.log

      - name: Audit built app metadata
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/YoutubeVcd.app"
          PLIST="$APP_PATH/Info.plist"

          test -d "$APP_PATH"
          test -f "$PLIST"

          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          BACKGROUND_MODE="$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"

          test "$DISPLAY_NAME" = "YoutubeVcd"
          test "$BUNDLE_ID" = "com.tzn5web.leno"
          test "$BACKGROUND_MODE" = "audio"
          test "$VERSION" = "0.4.4"
          test "$BUILD" = "10"

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/YoutubeVcd.app"
          test -d "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          ditto -c -k --sequesterRsrc --keepParent \
            Payload YoutubeVcd-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: YoutubeVcd-v4-researched-webkit-background-ipa
          path: YoutubeVcd-unsigned.ipa
          if-no-files-found: error

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-evidence
          path: |
            analyze.log
            simulator-build.log
            build.log
          if-no-files-found: ignore
