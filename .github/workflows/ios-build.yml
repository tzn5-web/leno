name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        run: |
          xcrun swift Scripts/GenerateAppIcon.swift Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test -s Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: V9 native media lab structural audit
        run: |
          set -euo pipefail
          python3 Scripts/audit_v9.py
          python3 -m py_compile Resolver/app/main.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/AnalyzeData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            analyze | tee analyze.log

      - name: Simulator compile smoke
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee simulator-build.log

          SIM_APP="build/SimulatorData/Build/Products/Debug-iphonesimulator/YoutubeVcd.app"
          test -d "$SIM_APP"

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project YoutubeVcd.xcodeproj \
            -scheme YoutubeVcd \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee build.log

      - name: Audit built app metadata
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/YoutubeVcd.app"
          PLIST="$APP_PATH/Info.plist"

          test -d "$APP_PATH"
          test -f "$PLIST"

          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          BACKGROUND_MODE="$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"

          test "$DISPLAY_NAME" = "YoutubeVcd V9"
          test "$BUNDLE_ID" = "com.tzn5web.leno"
          test "$BACKGROUND_MODE" = "audio"
          test "$VERSION" = "0.9.2"
          test "$BUILD" = "4"

          find "$APP_PATH" -maxdepth 1 -iname '*AppIcon*' -print \
            | tee app-icon-files.log

          test -s Leno/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/YoutubeVcd.app"
          test -d "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          ditto -c -k --sequesterRsrc --keepParent \
            Payload YoutubeVcd-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: YoutubeVcd-v9.2-build4-ipa
          path: YoutubeVcd-unsigned.ipa
          if-no-files-found: error

      - name: Package V9 source snapshot
        run: |
          set -euo pipefail
          rm -rf YoutubeVcd-V9-source
          mkdir -p YoutubeVcd-V9-source/Leno
          cp -R V9 Resolver Scripts YoutubeVcd-V9-source/
          cp -R Leno/Assets.xcassets YoutubeVcd-V9-source/Leno/
          cp Leno/Info.plist YoutubeVcd-V9-source/Leno/
          cp project.yml V9_ARCHITECTURE_AUDIT.md YoutubeVcd-V9-source/

          if find YoutubeVcd-V9-source -type f \
            \( -name 'YouTubeWebView.swift' -o -name 'NativePlaybackController.swift' -o -name 'BackgroundAudioHandoff.swift' \) \
            | grep -q .; then
            echo "Legacy playback sources leaked into V9 source package."
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            YoutubeVcd-V9-source YoutubeVcd-V9-source.zip

      - name: Upload V9 source
        uses: actions/upload-artifact@v7
        with:
          name: YoutubeVcd-v9.2-build4-source
          path: YoutubeVcd-V9-source.zip
          if-no-files-found: error

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-evidence
          path: |
            analyze.log
            build.log
            simulator-build.log
            app-icon-files.log
          if-no-files-found: ignore

  resolver-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build VcdResolver image
        run: docker build -t vcd-resolver:v9.2 Resolver

      - name: Start resolver
        run: |
          docker run -d --rm \
            --name vcd-resolver-v92 \
            -p 8085:8085 \
            vcd-resolver:v9.2

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8085/health > resolver-health.json; then
              break
            fi
            sleep 1
          done

          test -s resolver-health.json

      - name: Audit resolver runtime
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          with open("resolver-health.json", "r", encoding="utf-8") as handle:
              health = json.load(handle)
          assert health["ok"] is True
          assert health["version"] == "0.3.0-lab"
          assert health["js_runtime"] == "deno"
          assert int(health["relay_ttl"]) >= 3600
          assert int(health["max_relay_entries"]) >= 32
          assert health["cookies_configured"] is False
          assert health["public_base_configured"] is False
          print("resolver health:", health)
          PY

          docker exec vcd-resolver-v92 deno --version | tee resolver-deno.txt
          grep -q '^deno 2\.9\.7' resolver-deno.txt

          docker exec vcd-resolver-v92 yt-dlp --version | tee resolver-ytdlp.txt
          grep -q '^2026\.08\.19' resolver-ytdlp.txt

          docker exec vcd-resolver-v92 python - <<'PY'
          import yt_dlp_ejs
          from app.main import VIDEO_ID_RE, choose_formats, is_relayable_format

          assert VIDEO_ID_RE.fullmatch("dQw4w9WgXcQ")
          assert not VIDEO_ID_RE.fullmatch("../bad-video")

          assert is_relayable_format({
              "url": "https://example.invalid/video",
              "protocol": "https",
          })
          assert not is_relayable_format({
              "url": "https://example.invalid/live.m3u8",
              "protocol": "m3u8_native",
          })
          assert not is_relayable_format({
              "url": "https://example.invalid/dash",
              "protocol": "https",
              "fragments": [{"url": "segment-1"}],
          })

          info = {
              "formats": [
                  {
                      "format_id": "v1",
                      "url": "https://example.invalid/video",
                      "vcodec": "avc1.640028",
                      "acodec": "none",
                      "ext": "mp4",
                      "height": 1080,
                      "tbr": 4000,
                  },
                  {
                      "format_id": "a1",
                      "url": "https://example.invalid/audio",
                      "vcodec": "none",
                      "acodec": "mp4a.40.2",
                      "ext": "m4a",
                      "abr": 128,
                  },
              ]
          }

          video, audio = choose_formats(info)
          assert video["format_id"] == "v1"
          assert audio["format_id"] == "a1"
          print("resolver format selection: OK")
          PY

      - name: Stop resolver
        if: always()
        run: docker rm -f vcd-resolver-v92 || true

      - name: Upload resolver evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resolver-evidence
          path: |
            resolver-health.json
            resolver-deno.txt
            resolver-ytdlp.txt
          if-no-files-found: ignore
