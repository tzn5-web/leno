name: Vanced standalone playback modules
on:
  push:
    branches: [codex/vanced-playback-fix]
    paths: ['VancedIOS/Standalone/**', '.github/workflows/vanced-standalone.yml']
  pull_request:
    paths: ['VancedIOS/Standalone/**', '.github/workflows/vanced-standalone.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vanced-standalone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build native playback modules
        run: python3 VancedIOS/Standalone/build.py
      - name: Verify independent identity and native re-signability
        run: python3 -m unittest discover -s VancedIOS/Standalone/Tests -p 'test_*.py'
      - name: Upload modules and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: vanced-standalone-modules
          path: VancedIOS/Standalone/artifacts/
          if-no-files-found: error
