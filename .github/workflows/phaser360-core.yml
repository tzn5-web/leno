name: Phaser360 core

on:
  push:
    branches:
      - phaser360-sof-windows-port
    paths:
      - "Phaser360/**"
      - ".github/workflows/phaser360-core.yml"
  pull_request:
    paths:
      - "Phaser360/**"

jobs:
  core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail-closed core smoke
        run: |
          chmod +x Phaser360/tests/run_core_smoke.sh
          Phaser360/tests/run_core_smoke.sh

      - name: B4 provenance and architecture contract
        run: |
          python3 Phaser360/tests/source_contract.py

      - name: Compile and exercise audited B4 core
        run: |
          chmod +x Phaser360/tests/run_b4_core.sh
          Phaser360/tests/run_b4_core.sh

      - name: NHLT parser regression
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            Phaser360/tests/nhlt_regression.c \
            Phaser360/src/p360_nhlt.c \
            Phaser360/src/p360_board.c \
            -IPhaser360/include \
            -o /tmp/p360_nhlt_regression
          /tmp/p360_nhlt_regression
