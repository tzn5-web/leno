name: K2401 Azure Linux VM - immutable 21 UHD assets and audited Android build
# Azure VM is billable. Never start it automatically for every UI/script
# iteration; the K2401 signed and emulator tests use GitHub-hosted runners.
# Azure VM tests are opt-in only via explicit workflow_dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: k2401-existing-azure-vm
  cancel-in-progress: false
jobs:
  k2401-existing-azure:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      RESOURCE_GROUP: rg-chatgpt-azure
      VM_NAME: android-dev-linux
      STORAGE_ACCOUNT: tzn5androidartifacts26
      STORAGE_CONTAINER: k2401-evo-private
    steps:
      - uses: actions/checkout@v4
      - name: Preflight - no source or design mutation
        run: |
          set -euo pipefail
          bash -n projects/k2401-evo-launcher/scripts/azure-k2401-workspace.sh
          bash -n projects/k2401-evo-launcher/scripts/emulator-smoke.sh
          test -f projects/k2401-evo-launcher/scripts/models/FSRCNN_x2.pb.base64
          test -f projects/k2401-evo-launcher/scripts/verify-native-layout.py
          echo 'K2401_ORIGINAL_SOURCE_PRECHECK=PASS'
      - name: Azure OIDC login, reuse existing identity
        uses: azure/login@v3
        with:
          client-id: 50a5c260-15a0-4aa0-9e02-5f0ad5c23df9
          tenant-id: 779623db-ec2e-495b-9828-85d42baa77ee
          subscription-id: 0ac7a514-32b3-47bf-bf89-e17906b1cc86
      - name: Verify VM is deallocated and existing Blob account is private
        run: |
          set -euo pipefail
          STATE="$(az vm show -g "$RESOURCE_GROUP" -n "$VM_NAME" -d --query 'powerState' -o tsv)"
          # The Azure CLI can return either UI display text or a REST state code.
          # Never proceed if neither explicitly says the VM is deallocated.
          test "$STATE" = "VM deallocated" || test "$STATE" = "PowerState/deallocated" || {
            echo "::error::VM not deallocated: $STATE"; exit 2;
          }
          PUBLIC="$(az storage account show -g "$RESOURCE_GROUP" -n "$STORAGE_ACCOUNT" \
            --query allowBlobPublicAccess -o tsv | tr '[:upper:]' '[:lower:]')"
          test "$PUBLIC" = false
          echo 'K2401_EXISTING_VM_STOPPED_AND_STORAGE_PRIVATE=PASS'
      - name: Create private container and ephemeral SAS credential
        run: |
          set -euo pipefail
          KEY="$(az storage account keys list -g "$RESOURCE_GROUP" -n "$STORAGE_ACCOUNT" --query '[0].value' -o tsv)"
          test -n "$KEY"
          echo "::add-mask::$KEY"
          az storage container create -n "$STORAGE_CONTAINER" --account-name "$STORAGE_ACCOUNT" \
            --account-key "$KEY" -o none
          EXPIRY="$(date -u -d '+3 hours' '+%Y-%m-%dT%H:%MZ')"
          SAS="$(az storage container generate-sas -n "$STORAGE_CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" --account-key "$KEY" \
            --permissions racwl --expiry "$EXPIRY" --https-only -o tsv)"
          test -n "$SAS"
          echo "::add-mask::$SAS"
          URL="https://$STORAGE_ACCOUNT.blob.core.windows.net/$STORAGE_CONTAINER?$SAS"
          echo "::add-mask::$URL"
          SAS_B64="$(printf '%s' "$URL" | base64 -w0)"
          echo "::add-mask::$SAS_B64"
          echo "BLOB_SAS_B64=$SAS_B64" >> "$GITHUB_ENV"
          echo 'K2401_PRIVATE_STORAGE_READY=PASS'
      - name: Start existing Azure Linux VM for bounded work
        timeout-minutes: 12
        run: |
          set -euo pipefail
          echo 'K2401_START_ATTEMPTED=true' >> "$GITHUB_ENV"
          az vm start -g "$RESOURCE_GROUP" -n "$VM_NAME" -o none
          echo 'K2401_VM_STARTED=PASS'
      # This invocation uses the pinned Python virtualenv for Gradle and saves
      # the 21 source-locked 4K candidates before compilation, even on build failure.
      - name: Install agents, restore locked images, compile APK inside Azure
        timeout-minutes: 42
        run: |
          set -euo pipefail
          az vm run-command invoke -g "$RESOURCE_GROUP" -n "$VM_NAME" \
            --command-id RunShellScript \
            --scripts @projects/k2401-evo-launcher/scripts/azure-k2401-workspace.sh \
            --parameters "ExpectedSha=$GITHUB_SHA" "BlobSasB64=$BLOB_SAS_B64" \
            --query 'value[].message' -o tsv | tee azure-workspace-summary.txt
          grep -Fq 'K2401_AZURE_WORKSPACE_AGENTS=PASS' azure-workspace-summary.txt
      - name: Verify all source-locked output files in private Azure Blob
        run: |
          set -euo pipefail
          KEY="$(az storage account keys list -g "$RESOURCE_GROUP" -n "$STORAGE_ACCOUNT" --query '[0].value' -o tsv)"
          echo "::add-mask::$KEY"
          PREFIX="frozen-$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          for FILE in k2401-locked-originals.tar.gz k2401-21-uhd-assets.tar.gz k2401-audited-debug-not-release.apk; do
            az storage blob show -c "$STORAGE_CONTAINER" -n "$PREFIX/$FILE" \
              --account-name "$STORAGE_ACCOUNT" --account-key "$KEY" \
              --query '{name:name,size:properties.contentLength}' -o json
          done
          echo 'K2401_PRIVATE_AZURE_ASSETS_AND_DEBUG_BUILD=PASS'
      - name: Retrieve Azure emulator screenshots and diagnostics for independent quality audit
        if: always() && env.K2401_START_ATTEMPTED == 'true'
        shell: bash
        run: |
          mkdir -p azure-emulator-evidence
          KEY="$(az storage account keys list -g "$RESOURCE_GROUP" -n "$STORAGE_ACCOUNT" --query '[0].value' -o tsv 2>/dev/null || true)"
          if [[ -z "$KEY" ]]; then echo "K2401_AZURE_EMULATOR_DIAGNOSTICS_UNAVAILABLE=NO_STORAGE_KEY"; exit 0; fi
          echo "::add-mask::$KEY"
          PREFIX="frozen-${GITHUB_SHA:0:12}"
          if az storage blob download -c "$STORAGE_CONTAINER" \
            -n "$PREFIX/k2401-azure-emulator-21-screens.tar.gz" \
            --account-name "$STORAGE_ACCOUNT" --account-key "$KEY" \
            -f azure-emulator-evidence/21-screens.tar.gz --overwrite true -o none 2>/dev/null; then
              tar xzf azure-emulator-evidence/21-screens.tar.gz -C azure-emulator-evidence
              echo "K2401_AZURE_ACTUAL_EMULATOR_EVIDENCE_DOWNLOADED=PASS"
          else echo "K2401_AZURE_EMULATOR_DIAGNOSTICS_NOT_YET_AVAILABLE"; fi
      - name: Publish Azure native Android emulator evidence for every build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k2401-azure-actual-android10-screens
          path: azure-emulator-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish audit report only, not installable APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k2401-existing-azure-qa-report
          path: azure-workspace-summary.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Always deallocate VM and stop compute billing
        if: always() && env.K2401_START_ATTEMPTED == 'true'
        timeout-minutes: 12
        run: |
          az vm deallocate -g "$RESOURCE_GROUP" -n "$VM_NAME" -o none
          echo 'K2401_EXISTING_VM_DEALLOCATED=PASS'
      - name: Logout
        if: always()
        run: az logout || true
