name: K2401 EVO signed Android 10 prerelease (no Azure VM)
# Builds a real signed APK with an Azure Key Vault persisted signing certificate.
# Deliberately does NOT create a VM or require an emulator to publish the APK.
on:
  push:
    branches: [feature/k2401-evo-launcher]
    paths:
      - 'projects/k2401-evo-launcher/**'
      - '.github/workflows/k2401-signed-prerelease.yml'
  workflow_dispatch:
permissions:
  contents: write  # Required only for publishing the public direct-download prerelease asset.
  id-token: write
concurrency:
  group: k2401-signed-prerelease
  cancel-in-progress: true
env:
  APK: projects/k2401-evo-launcher/app/build/outputs/apk/release/app-release.apk
  KEY_VAULT: k2401evo2026sign
  # Verified in the existing Azure release signing job (27 Oct 2026).
  # Refuse to ship if the keystore was silently regenerated.
  EXPECTED_CERT_SHA256: 04d7491efbc49fd5d8a99d51095c16f6bb35ba2ab464cd3daf39f10d974bb2d9
jobs:
  build-signed-prerelease:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact 21-theme image restoration dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0" "opencv-contrib-python-headless==4.10.0.84"
      - name: Verify all 20 native layout geometries and 21-theme UI contracts
        run: python3 projects/k2401-evo-launcher/scripts/verify-native-layout.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify source and hardware-reading contract
        shell: bash
        run: |
          set -euo pipefail
          BASE=projects/k2401-evo-launcher/app/src/main/java/ro/evolauncher/k2401
          grep -Fq 'class ShortcutDock' "$BASE/ShortcutDock.java"
          grep -Fq 'dock_pins_v1' "$BASE/ShortcutDock.java"
          grep -Fq '"STFT B1","LTFT B1","RPM","TEMP APĂ"' "$BASE/MainActivity.java"
          grep -Fq 'getPIDUpdateTime' "$BASE/ObdReader.java"
          grep -Fq 'GoogleApiAvailability' "$BASE/LiveMapPanel.java"
          grep -Fq 'wallpaper_preset' "$BASE/LauncherSettings.java"
          grep -Fq 'capturedAtMs' "$BASE/ObdReader.java"
          grep -Fq 'generation' "$BASE/ObdReader.java"
          # Fail release if the three formerly broken embedded integrations regress.
          grep -Fq 'org.osmdroid.views.MapView' "$BASE/LiveMapPanel.java"
          grep -Fq 'CAUTA LOC' "$BASE/LiveMapPanel.java"
          if grep -Eq 'unpkg\.com|L\.tileLayer|new WebView' "$BASE/LiveMapPanel.java"; then
            echo "::error::Map must not depend on remote Leaflet JS or WebView"
            exit 3
          fi
          grep -Fq 'void choosePlayer()' "$BASE/MainActivity.java"
          grep -Fq 'evo_media_package' "$BASE/MainActivity.java"
          if grep -Fq 'market://details' "$BASE/MainActivity.java"; then
            echo "::error::Player taps must never open the Play Store"
            exit 4
          fi
          grep -Fq 'getValueForPid(ids[i],true)' "$BASE/ObdReader.java"
          grep -Fq 'getUpdateTimeForPID(ids[i])' "$BASE/ObdReader.java"
          if grep -Eq 'Build.FINGERPRINT.contains\\("generic"\\)|emu\\?Float.NaN|if\\(!emu\\)obd.start' "$BASE/MainActivity.java"; then
            echo "::error::Real K2401 device may be falsely classified as emulator; OBD/GPS blocked"
            exit 2
          fi
          if grep -Eq 'HARTĂ DEMO|Str\\. Mihai Viteazul|Blinding Lights' "$BASE/MainActivity.java"; then
            echo "::error::Demo content in production code"
            exit 2
          fi
          grep -Fq 'createRfcommSocketToServiceRecord(SPP)' "$BASE/DirectElm327.java"
          grep -Fq 'cancelDiscovery()' "$BASE/DirectElm327.java"
          grep -Fq 'new ElmBleSerial(context,device)' "$BASE/DirectElm327.java"
          grep -Fq 'new ObdInputPump(in)' "$BASE/DirectElm327.java"
          grep -Fq 'pump.untilPrompt(timeout)' "$BASE/DirectElm327.java"
          if grep -Fq 'in.available()' "$BASE/DirectElm327.java"; then
            echo "::error::Do not poll OEM SPP input.available() for ELM data"
            exit 6
          fi
          grep -Fq 'scanBleAdapters()' "$BASE/MainActivity.java"
          grep -Fq 'ObdPollPlan.next(' "$BASE/DirectElm327.java"
          grep -Fq 'class ElmBleSerial' "$BASE/ElmBleSerial.java"
          grep -Fq 'getBluetoothLeScanner()' "$BASE/MainActivity.java"
          grep -Fq 'new ClassicObdDiscovery(this' "$BASE/MainActivity.java"
          grep -Fq 'BluetoothAdapter.ACTION_DISCOVERY_FINISHED' "$BASE/ClassicObdDiscovery.java" || true
          grep -Fq 'adapter.startDiscovery()' "$BASE/ClassicObdDiscovery.java"
          grep -Fq 'BluetoothDevice.ACTION_BOND_STATE_CHANGED' "$BASE/ClassicObdDiscovery.java"
          grep -Fq 'scanClassicAdapters()' "$BASE/MainActivity.java"
          grep -Fq 'showBluetoothDiagnosis()' "$BASE/MainActivity.java"
          grep -Fq 'elm327_last_mode' "$BASE/DirectElm327.java"
          grep -Fq 'getBondedDevices()' "$BASE/MainActivity.java"
          grep -Fq 'Nominatim' "$BASE/LiveMapPanel.java"
          # OEM crash hotfix: never initialize Bluetooth before manual setup.
          grep -Fq 'evo_skip_obd_at_start' "$BASE/MainActivity.java"
          grep -Fq 'private volatile DirectElm327 direct' "$BASE/ObdReader.java"
          grep -Fq 'last_exception' "$BASE/EvoApplication.java"
          grep -Fq 'K2401 EVO — RECUPERARE' "$BASE/SafeModeActivity.java"
          # User requirement: originals must be IN THE APK, never require ZIP import.
          SKINS=projects/k2401-evo-launcher/app/src/main/assets/skins
          test -s "$SKINS/atlas.webp"
          for i in $(seq -w 0 20); do
            test -s "$SKINS/skin_$i.webp" || {
              echo "::error::Missing bundled original skin $i"
              exit 7
            }
          done
          python3 - <<'PY'
          import pathlib,struct
          folder=pathlib.Path("projects/k2401-evo-launcher/app/src/main/assets/skins")
          files=sorted(folder.glob("skin_??.webp"))
          assert len(files)==21, f"Expected 21 originals; found {len(files)}"
          import hashlib
          digests=[]
          for image in files:
              body=image.read_bytes()
              assert body[:4]==b'RIFF' and body[8:12]==b'WEBP',image
              assert len(body)>=128,image
              # The 21 project originals are 1280x720 VP8 WebP.
              assert body[12:16]==b'VP8 ',f"Unexpected image codec: {image}"
              width=int.from_bytes(body[26:28],'little') & 0x3fff
              height=int.from_bytes(body[28:30],'little') & 0x3fff
              assert (width,height)==(1280,720),f"Wrong skin resolution: {image}: {width}x{height}"
              digests.append(hashlib.sha256(body).hexdigest())
          assert len(set(digests))==21,"Skin images are unexpectedly duplicated"
          print('K2401_21_ORIGINAL_SKIN_ASSETS=PASS 1280x720 unique=21')
          PY
          grep -Fq 'static final int[] STYLES' "$BASE/SkinEngine.java"
          grep -Fq 'ObdReader.Reading rd=' "$BASE/SkinEngine.java"
          grep -Fq 'Float.isFinite(reading)' "$BASE/SkinEngine.java"
          grep -Fq 'host.showInstalledApps()' "$BASE/SkinEngine.java"
          # The first skin has bespoke Dashboard widgets; the other 20 use
          # native artwork-aligned media, PID gauges and real app icons.
          grep -Fq 'drawEvoDigitalDashNative(c)' "$BASE/SkinEngine.java"
          grep -Fq 'nativePanels.draw(c,id)' "$BASE/SkinEngine.java"
          grep -Fq 'MediaController mc=host.media' "$BASE/ThemeNativePanels.java"
          grep -Fq 'float[] values={rd.rpm,rd.stft,rd.ltft,rd.coolantC}' "$BASE/ThemeNativePanels.java"
          grep -Fq 'pm.getApplicationIcon(installed.get(i))' "$BASE/ThemeNativePanels.java"
          grep -Fq 'showSkinPicker()' "$BASE/MainActivity.java"
          grep -Fq 'selected_skin_v2' "$BASE/SkinEngine.java"
          grep -Fq 'getAssets().open(' "$BASE/SkinEngine.java"
          echo 'K2401_RELEASE_SOURCE_GATE=PASS'
      - name: Verify real ECU PID decoding, no fake readings
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          javac -encoding UTF-8 -d "$TMP" \
            projects/k2401-evo-launcher/app/src/main/java/ro/evolauncher/k2401/ObdPidCodec.java \
            projects/k2401-evo-launcher/scripts/ObdPidCodecCheck.java
          java -cp "$TMP" ro.evolauncher.k2401.ObdPidCodecCheck
          javac -encoding UTF-8 -d "$TMP" \
            projects/k2401-evo-launcher/app/src/main/java/ro/evolauncher/k2401/ObdPollPlan.java \
            projects/k2401-evo-launcher/scripts/ObdPollPlanCheck.java
          java -cp "$TMP" ro.evolauncher.k2401.ObdPollPlanCheck
      - name: Authenticate to Azure Key Vault using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: 50a5c260-15a0-4aa0-9e02-5f0ad5c23df9
          tenant-id: 779623db-ec2e-495b-9828-85d42baa77ee
          subscription-id: 0ac7a514-32b3-47bf-bf89-e17906b1cc86
      - name: Restore persistent signing identity from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          az keyvault secret show --vault-name "$KEY_VAULT" -n k2401-android-signing-v1 --query value -o tsv > /tmp/k2401-signing.json
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          s=json.loads(Path('/tmp/k2401-signing.json').read_text())
          assert s['alias']=='k2401release' and s['format']=='PKCS12', 'unexpected release signing key identity'
          key=Path('/tmp/k2401-release.jks')
          key.write_bytes(base64.b64decode(s['keystore'],validate=True))
          key.chmod(0o600)
          password=s['password']
          assert len(password)>=24 and '\n' not in password
          print('::add-mask::'+password)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('K2401_RELEASE_PASSWORD='+password+'\n')
              out.write('K2401_RELEASE_KEYSTORE=/tmp/k2401-release.jks\n')
          PY
          rm -f /tmp/k2401-signing.json
          echo 'PERSISTENT_KEY_VAULT_KEYSTORE_RESTORED=PASS'
      - name: Build Android 10 signed release APK
        shell: bash
        env:
          K2401_MAPS_API_KEY: ${{ secrets.K2401_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${K2401_MAPS_API_KEY:-}" ]]; then
            echo 'GOOGLE_MAPS_SDK_KEY=CONFIGURED'
          else
            echo 'GOOGLE_MAPS_SDK_KEY=ABSENT_OSM_FALLBACK'
          fi
          K2401_REQUIRE_SR=YES gradle --no-daemon -p projects/k2401-evo-launcher :app:assembleRelease
          test -s "$APK"
          python3 - <<'PY'
          import zipfile
          apk="projects/k2401-evo-launcher/app/build/outputs/apk/release/app-release.apk"
          with zipfile.ZipFile(apk) as z:
            entries=set(z.namelist())
            base="assets/skins/"
            required={base+"atlas.webp"}|{base+f"skin_{i:02d}.webp" for i in range(21)}
            missing=required-entries
            assert not missing, "SKINS MISSING FROM APK: "+", ".join(sorted(missing))
            print("K2401_SIGNED_APK_EMBEDS_ALL_21_SKINS=PASS")
          PY
      - name: Verify all twenty-one original and high-resolution assets in signed APK
        shell: bash
        run: |
          python3 - <<'PY'
          import io,zipfile,json,hashlib
          from PIL import Image
          apk="projects/k2401-evo-launcher/app/build/outputs/apk/release/app-release.apk"
          with zipfile.ZipFile(apk) as z:
            for i in range(21):
              orig=f"assets/skins/skin_{i:02}.webp"
              high=f"assets/skins/uhd/skin_{i:02}.webp"
              clean=f"assets/skins/clean/skin_{i:02}.webp"
              assert orig in z.namelist() and high in z.namelist() and clean in z.namelist(), (orig,high,clean)
              with Image.open(io.BytesIO(z.read(high))) as img:
                assert img.size == (2560,1440), (high,img.size)
              with Image.open(io.BytesIO(z.read(clean))) as img:
                assert img.size == (2560,1440), (clean,img.size)
            approved="assets/skins/approved/ultra-neon-2560x1440.webp"
            assert approved in z.namelist(), "Approved UHD wallpaper missing from signed APK"
            with Image.open(io.BytesIO(z.read(approved))) as image:
              assert image.size==(2560,1440), image.size
            manifest=json.loads(z.read("assets/skins/cinematic/cinematic-4k-manifest.json"))
            assert [r["skin"] for r in manifest]==["A1","02","A3"]
            for i,entry in enumerate(manifest):
              approved_name=f"assets/skins/cinematic/approved-{entry['skin']}.webp"
              name=f"assets/skins/cinematic/scene_{i}_4k.webp"
              assert approved_name in z.namelist(), "Missing exact user-approved source: "+approved_name
              assert name in z.namelist(), "Missing cinematic 4K photo: "+name
              assert entry["source_sha256"]==hashlib.sha256(z.read(approved_name)).hexdigest()
              with Image.open(io.BytesIO(z.read(approved_name))) as image:
                assert image.size==(1672,941),(approved_name,image.size)
              with Image.open(io.BytesIO(z.read(name))) as image:
                assert image.size==(3840,2160),(name,image.size)
              assert entry["cleaned_baked_HUD"] and entry["cleaned_baked_shortcuts"]
          print("K2401_21_APPROVED_ORIGINALS_AND_CLEAN_BACKGROUNDS_SIGNED=PASS")
          print("K2401_THREE_3840X2160_CINEMATIC_SCENES_SIGNED=PASS")
          print("K2401_EXACT_APPROVED_NEW_A1_02_A3_IMAGES_SIGNED=PASS")
          print("K2401_22ND_APPROVED_UHD_ASSET_SIGNED=PASS")
          PY
      - name: Verify approved EVO RED UHD 4K artwork and native HUD contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,io
          from PIL import Image
          apk=Path("projects/k2401-evo-launcher/app/build/outputs/apk/release/app-release.apk")
          assert apk.is_file()
          with zipfile.ZipFile(apk) as z:
            asset="assets/skins/approved/evo-red-scene-3840x2160.webp"
            assert asset in z.namelist(), "Missing EVO RED 4K scene in signed APK"
            with Image.open(io.BytesIO(z.read(asset))) as im:
              assert im.size==(3840,2160),im.size
          root=Path("projects/k2401-evo-launcher/app/src/main/java/ro/evolauncher/k2401")
          race=(root/"RaceHudFinalTheme.java").read_text()
          engine=(root/"SkinEngine.java").read_text()
          slots=(root/"UltraCockpitTheme.java").read_text()
          for name in ("r.rpm","r.coolantC","r.stft","r.ltft","r.ambientC","slots.drawUserSlots(c)","approvedTop(c)"):
            assert name in race,name
          assert "EVO_RED_ID=28" in race
          assert "selected==RaceHudFinalTheme.EVO_RED_ID" in engine
          assert "id==RaceHudFinalTheme.EVO_RED_ID" in slots
          assert 'label(c,"MUZICĂ",850,74' in race, "EVO RED native music control missing"
          assert 'if(x>=815&&x<923){host.page=1;' in race, "EVO RED music touch target missing"
          for title in ('"APPS"','"NAVI"','"MUZICĂ"','"SETUP"'):
            assert title in race, ("Missing native header action",title)
          assert "K2401_PARALLEL_APK" in Path("projects/k2401-evo-launcher/app/build.gradle").read_text()
          print("K2401_EVO_RED_V118_4K_LIVE_HUD_CONTRACT=PASS")
          PY
      - name: Verify Android 10 APK signature and persistent certificate
        shell: bash
        env:
          K2401_MAPS_API_KEY: ${{ secrets.K2401_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 29 --verbose --print-certs "$APK" | tee /tmp/k2401-apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/k2401-apksigner.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/k2401-apksigner.txt | head -n1)"
          test -n "$CERT"
          test "$CERT" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::Release certificate changed unexpectedly. Refusing to publish."
            exit 3
          }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/k2401-badging.txt
          grep -Fq "package: name='ro.evolauncher.k2401'" /tmp/k2401-badging.txt
          grep -Fq "sdkVersion:'26'" /tmp/k2401-badging.txt
          grep -Fq "targetSdkVersion:'28'" /tmp/k2401-badging.txt
          MAPS_STATUS=ABSENT_OSM_FALLBACK
          if [[ -n "${K2401_MAPS_API_KEY:-}" ]]; then MAPS_STATUS=CONFIGURED; fi
          {
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo "ANDROID_10_API_29_SIGNATURE_VERIFY=PASS"
            echo "PERSISTENT_RELEASE_CERT_SHA256=$CERT"
            echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)"
            echo "ANDROID_10_MANIFEST_COMPATIBILITY=PASS"
            echo "AZURE_VM_EMULATOR=SKIPPED_BY_USER_DECISION"
            echo "GOOGLE_MAPS_SDK_KEY=$MAPS_STATUS"
            echo "PHYSICAL_ELM327_AND_OEM_INTEGRATION=NOT_YET_VERIFIED"
            echo "RELEASE_STATUS=SIGNED_PRERELEASE_FOR_MANUAL_HEADUNIT_TEST"
          } > k2401-signed-prerelease-report.txt
          echo 'K2401_SIGNED_PRERELEASE_GATE=PASS'
      - name: Build parallel install APK without replacing the currently installed app
        shell: bash
        env:
          K2401_MAPS_API_KEY: ${{ secrets.K2401_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          # Save the signed production app before changing the applicationId.
          cp "$APK" K2401-EVO-UPDATE-SIGNED.apk
          K2401_PARALLEL_APK=YES K2401_REQUIRE_SR=YES gradle --no-daemon \
            -p projects/k2401-evo-launcher :app:assembleRelease
          cp "$APK" K2401-EVO-ULTRA-INSTALL-SEPARAT.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 29 \
            --verbose --print-certs K2401-EVO-ULTRA-INSTALL-SEPARAT.apk > /tmp/k2401-parallel-sign.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/k2401-parallel-sign.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/k2401-parallel-sign.txt | head -n1)"
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            K2401-EVO-ULTRA-INSTALL-SEPARAT.apk | grep -Fq "package: name='ro.evolauncher.k2401.ultra'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            K2401-EVO-ULTRA-INSTALL-SEPARAT.apk | grep -Fq "versionCode='124'"
          # Recreate the exact original production APK, never accidentally
          # publish the parallel APK as an in-place update.
          cp K2401-EVO-UPDATE-SIGNED.apk "$APK"
          # The DEFAULT download is exactly the original signed production APK.
          # Android's PackageInstaller selects fresh install or in-place update.
          cp "$APK" K2401-EVO-UNIVERSAL-v119.apk
          cmp -s "$APK" K2401-EVO-UNIVERSAL-v119.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" |
            grep -Fq "package: name='ro.evolauncher.k2401'"
          # Distinct build-time debug certificate lets the emulator reproduce
          # users' INSTALL_FAILED_UPDATE_INCOMPATIBLE without touching real data.
          K2401_REQUIRE_SR=YES gradle --no-daemon -p projects/k2401-evo-launcher :app:assembleDebug
          echo 'K2401_SIGNED_PARALLEL_INSTALL_PACKAGE=PASS'
      - name: Fetch previous signed v118 for universal install test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIR=/tmp/k2401-universal-baseline
          mkdir -p "$DIR"
          gh release download k2401-evo-e5f6cf780011 --repo "$GITHUB_REPOSITORY" \
            --pattern 'K2401-EVO-Android10-SIGNED.apk' --dir "$DIR"
          OLD="$DIR/K2401-EVO-Android10-SIGNED.apk"
          test -s "$OLD"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OLD" | \
            grep -F "package: name='ro.evolauncher.k2401'" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OLD" | \
            grep -F "versionCode='123'" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --min-sdk-version 29 --print-certs "$OLD" | \
            grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256"
          test -s K2401-EVO-UNIVERSAL-v119.apk
          cmp -s K2401-EVO-UNIVERSAL-v119.apk K2401-EVO-UPDATE-SIGNED.apk
          echo "K2401_PREVIOUS_RELEASE_AND_NEW_UNIVERSAL_IDENTITY=PASS"
      - name: Enable KVM for signed installation emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install BOTH signed APKs on Android 10 and reproduce signature conflict
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -skin 720x1280
          disable-animations: true
          script: bash projects/k2401-evo-launcher/scripts/verify-universal-install.sh && bash projects/k2401-evo-launcher/scripts/install-signed-smoke.sh
      # A failed emulator visual gate must never publish an unverified APK.
      # Preserve only screenshots so a failed gate can be diagnosed.
      - name: Preserve Android 10 HUD screenshots on failed visual verification
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: K2401-HUD-FAILED-VISUAL-DIAGNOSTICS
          path: k2401-glass-hud-signed-screens/
          if-no-files-found: warn
          retention-days: 7
      - name: Record verified universal fresh-install and upgrade checks
        run: |
          {
            echo "ONE_APK_FRESH_INSTALL_OR_UPDATE=PASS"
            echo "SAME_APP_ID_AND_SIGNER_PRESERVES_DATA_ON_UPDATE=PASS"
            echo "UNINSTALL_REINSTALL_CLEARS_APP_DATA_BY_ANDROID_DESIGN=EXPECTED"
          } >> k2401-signed-prerelease-report.txt
      - name: Upload signed APK for head-unit testing without Azure VM
        uses: actions/upload-artifact@v4
        with:
          name: K2401-EVO-Android10-SIGNED-PRERELEASE
          path: |
            ${{ env.APK }}
            K2401-EVO-UPDATE-SIGNED.apk
            K2401-EVO-UNIVERSAL-v119.apk
            K2401-EVO-ULTRA-INSTALL-SEPARAT.apk
            k2401-signed-prerelease-report.txt
            k2401-evo-red-v118-emulator.png
            k2401-glass-hud-signed-screens/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release when repository policy allows; preserve signed artifact otherwise
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="k2401-evo-${GITHUB_SHA:0:12}"
          ASSET=K2401-EVO-Android10-SIGNED.apk
          cp "$APK" "$ASSET"
          test -s "$ASSET"
          zip -q -r K2401-GLASS-HUD-21-28-SIGNED-SCREENSHOTS.zip k2401-glass-hud-signed-screens
          test -s K2401-GLASS-HUD-21-28-SIGNED-SCREENSHOTS.zip
          if gh release create "$TAG" "$ASSET" K2401-EVO-UNIVERSAL-v119.apk K2401-EVO-ULTRA-INSTALL-SEPARAT.apk \
            k2401-signed-prerelease-report.txt \
            K2401-GLASS-HUD-21-28-SIGNED-SCREENSHOTS.zip \
            k2401-glass-hud-signed-screens/K2401-HOLOGRAPHIC-21-28-ANDROID10.jpg \
            k2401-glass-hud-signed-screens/holographic-audit.json \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "K2401 EVO Android 10 v119 universal install + glass HUD ($TAG)" \
            --notes "v119 (versionCode 124): one production APK installs from zero or updates the same package in place preserving data, with same permanent Key Vault signing certificate. Clean reinstall after uninstall restores built-in skins but cannot restore deleted private settings. Preserves all 21 original skins (IDs 0-20) AND the user's blue-neon Ultra skin 21, repairing only its inner grey ring crossing the gauge graduations; redesigns opt-in skins 22-28 in graphite/silver/fine-red translucent glass HUD. Includes original 3840x2160 cinematic assets, four genuine ECU PIDs, live MediaSession, real date/time, OBD ambient or N/A, six editable shortcuts and native actions. Eight DISTINCT signed Android 10 screenshots are verified by actual persisted skin selection on a disposable emulator; pixel audit and original frames are attached for human review. Visual fidelity to the user's photos and physical K2401/ELM327 behavior are NOT verified. No Azure VM used."; then
            echo "UNIVERSAL_APK_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/K2401-EVO-UNIVERSAL-v119.apk" >> "$GITHUB_STEP_SUMMARY"
            echo 'K2401_DIRECT_APK_GITHUB_RELEASE=PASS'
          else
            # Some GitHub App / workflow installations deny release creation
            # (HTTP 403) despite contents:write. This is a publishing error,
            # not an APK build/signature/install failure. The artifact is above.
            echo "::warning::GitHub policy blocked release publishing (HTTP 403). Signed APKs remain in the uploaded run artifact."
            echo "SIGNED_APK_ARTIFACT=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
            echo 'K2401_SIGNED_APK_ARTIFACT_AVAILABLE=PASS'
          fi
      - name: Always remove temporary signing key and credentials
        if: always()
        shell: bash
        run: |
          rm -f /tmp/k2401-release.jks /tmp/k2401-signing.json /tmp/k2401-apksigner.txt
          az logout || true
