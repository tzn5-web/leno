name: K2401 EVO signed Android 10 prerelease (no Azure VM)
# Builds a real signed APK with an Azure Key Vault persisted signing certificate.
# Deliberately does NOT create a VM or require an emulator to publish the APK.
on:
  push:
    branches: [feature/k2401-evo-launcher]
    paths:
      - 'projects/k2401-evo-launcher/**'
      - '.github/workflows/k2401-signed-prerelease.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: k2401-signed-prerelease
  cancel-in-progress: true
env:
  APK: projects/k2401-evo-launcher/app/build/outputs/apk/release/app-release.apk
  KEY_VAULT: k2401evo2026sign
  # Verified in the existing Azure release signing job (27 Oct 2026).
  # Refuse to ship if the keystore was silently regenerated.
  EXPECTED_CERT_SHA256: 04d7491efbc49fd5d8a99d51095c16f6bb35ba2ab464cd3daf39f10d974bb2d9
jobs:
  build-signed-prerelease:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify source and hardware-reading contract
        shell: bash
        run: |
          set -euo pipefail
          BASE=projects/k2401-evo-launcher/app/src/main/java/ro/evolauncher/k2401
          grep -Fq 'class ShortcutDock' "$BASE/ShortcutDock.java"
          grep -Fq 'dock_pins_v1' "$BASE/ShortcutDock.java"
          grep -Fq '"STFT B1","LTFT B1","RPM","TEMP APĂ"' "$BASE/MainActivity.java"
          grep -Fq 'getPIDUpdateTime' "$BASE/ObdReader.java"
          grep -Fq 'GoogleApiAvailability' "$BASE/LiveMapPanel.java"
          grep -Fq 'wallpaper_preset' "$BASE/LauncherSettings.java"
          if grep -Eq 'HARTĂ DEMO|Str\\. Mihai Viteazul|Blinding Lights' "$BASE/MainActivity.java"; then
            echo "::error::Demo content in production code"
            exit 2
          fi
          echo 'K2401_RELEASE_SOURCE_GATE=PASS'
      - name: Authenticate to Azure Key Vault using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: 50a5c260-15a0-4aa0-9e02-5f0ad5c23df9
          tenant-id: 779623db-ec2e-495b-9828-85d42baa77ee
          subscription-id: 0ac7a514-32b3-47bf-bf89-e17906b1cc86
      - name: Restore persistent signing identity from Key Vault
        shell: bash
        run: |
          set -euo pipefail
          az keyvault secret show --vault-name "$KEY_VAULT" -n k2401-android-signing-v1 --query value -o tsv > /tmp/k2401-signing.json
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          s=json.loads(Path('/tmp/k2401-signing.json').read_text())
          assert s['alias']=='k2401release' and s['format']=='PKCS12', 'unexpected release signing key identity'
          key=Path('/tmp/k2401-release.jks')
          key.write_bytes(base64.b64decode(s['keystore'],validate=True))
          key.chmod(0o600)
          password=s['password']
          assert len(password)>=24 and '\n' not in password
          print('::add-mask::'+password)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('K2401_RELEASE_PASSWORD='+password+'\n')
              out.write('K2401_RELEASE_KEYSTORE=/tmp/k2401-release.jks\n')
          PY
          rm -f /tmp/k2401-signing.json
          echo 'PERSISTENT_KEY_VAULT_KEYSTORE_RESTORED=PASS'
      - name: Build Android 10 signed release APK
        shell: bash
        env:
          K2401_MAPS_API_KEY: ${{ secrets.K2401_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${K2401_MAPS_API_KEY:-}" ]]; then
            echo 'GOOGLE_MAPS_SDK_KEY=CONFIGURED'
          else
            echo 'GOOGLE_MAPS_SDK_KEY=ABSENT_OSM_FALLBACK'
          fi
          gradle --no-daemon -p projects/k2401-evo-launcher :app:assembleRelease
          test -s "$APK"
      - name: Verify Android 10 APK signature and persistent certificate
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 29 --verbose --print-certs "$APK" | tee /tmp/k2401-apksigner.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/k2401-apksigner.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/k2401-apksigner.txt | head -n1)"
          test -n "$CERT"
          test "$CERT" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::Release certificate changed unexpectedly. Refusing to publish."
            exit 3
          }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/k2401-badging.txt
          grep -Fq "package: name='ro.evolauncher.k2401'" /tmp/k2401-badging.txt
          grep -Fq "sdkVersion:'26'" /tmp/k2401-badging.txt
          grep -Fq "targetSdkVersion:'28'" /tmp/k2401-badging.txt
          {
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo "ANDROID_10_API_29_SIGNATURE_VERIFY=PASS"
            echo "PERSISTENT_RELEASE_CERT_SHA256=$CERT"
            echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)"
            echo "ANDROID_10_MANIFEST_COMPATIBILITY=PASS"
            echo "AZURE_VM_EMULATOR=SKIPPED_BY_USER_DECISION"
            echo "GOOGLE_MAPS_SDK_KEY=${K2401_MAPS_API_KEY:+CONFIGURED}"
            echo "PHYSICAL_TORQUE_AND_OEM_INTEGRATION=NOT_YET_VERIFIED"
            echo "RELEASE_STATUS=SIGNED_PRERELEASE_FOR_MANUAL_HEADUNIT_TEST"
          } > k2401-signed-prerelease-report.txt
          echo 'K2401_SIGNED_PRERELEASE_GATE=PASS'
      - name: Upload signed APK for head-unit testing without Azure VM
        uses: actions/upload-artifact@v4
        with:
          name: K2401-EVO-Android10-SIGNED-PRERELEASE
          path: |
            ${{ env.APK }}
            k2401-signed-prerelease-report.txt
          if-no-files-found: error
          retention-days: 30
      - name: Always remove temporary signing key and credentials
        if: always()
        shell: bash
        run: |
          rm -f /tmp/k2401-release.jks /tmp/k2401-signing.json /tmp/k2401-apksigner.txt
          az logout || true
