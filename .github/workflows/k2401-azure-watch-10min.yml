name: K2401 Azure - 10 minute monitor

# GitHub scheduled workflows are best-effort and may run late during high load.
# Monitor only: never starts, stops or changes the VM, and never deploys resources.
# Timeboxed to the initial 24-hour monitoring period to limit GitHub runner minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k2401-azure-watch-10min.yml'

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: k2401-azure-10min-monitor
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce monitoring window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d '2026-10-27T19:28:00Z' +%s)"
          NOW="$(date -u +%s)"
          if (( NOW <= CUTOFF )); then
            echo 'active=true' >> "$GITHUB_OUTPUT"
            echo 'K2401_MONITOR_WINDOW=ACTIVE'
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'K2401_MONITOR_WINDOW=FINISHED; no Azure calls will run.'
          fi
      - name: Disable this watcher after the 24-hour window
        if: steps.window.outputs.active == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/k2401-azure-watch-10min.yml/disable"
          echo 'K2401_MONITOR_AUTODISABLED=PASS'
      - name: Log in using persistent GitHub OIDC
        if: steps.window.outputs.active == 'true'
        uses: azure/login@v3
        with:
          client-id: 50a5c260-15a0-4aa0-9e02-5f0ad5c23df9
          tenant-id: 779623db-ec2e-495b-9828-85d42baa77ee
          subscription-id: 0ac7a514-32b3-47bf-bf89-e17906b1cc86
      - name: Inspect active run and VM (read-only)
        if: steps.window.outputs.active == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '40382269545'
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          RUN_STATUS="$(jq -r '.status' <<< "$RUN_JSON")"
          RUN_CONCLUSION="$(jq -r '.conclusion // "pending"' <<< "$RUN_JSON")"
          CREATED_AT="$(jq -r '.created_at' <<< "$RUN_JSON")"
          AGE_MINUTES="$(( ($(date -u +%s) - $(date -u -d "$CREATED_AT" +%s)) / 60 ))"
          POWER="$(az vm show -g rg-phaser360-driverlab -n int34d2-lab --show-details --query powerState -o tsv)"
          {
            echo '## K2401 Azure monitor'
            echo ""
            echo "- Checked (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- GitHub run: $RUN_ID"
            echo "- Run status: $RUN_STATUS"
            echo "- Run conclusion: $RUN_CONCLUSION"
            echo "- Run age (minutes): $AGE_MINUTES"
            echo "- VM power: $POWER"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "K2401_MONITOR run=$RUN_ID status=$RUN_STATUS conclusion=$RUN_CONCLUSION age_minutes=$AGE_MINUTES vm_power=$POWER"
          if [[ "$RUN_STATUS" == 'completed' && "$POWER" == 'VM running' ]]; then
            echo '::error::K2401 run completed but VM is still running and consuming Azure compute credit.'
            exit 4
          fi
          if [[ "$RUN_STATUS" != 'completed' && "$POWER" == 'VM running' && "$AGE_MINUTES" -ge 80 ]]; then
            echo '::error::K2401 Azure VM has remained running for over 80 minutes while test has not completed.'
            exit 5
          fi
          if [[ "$RUN_STATUS" == 'completed' && "$RUN_CONCLUSION" != 'success' ]]; then
            echo "::warning::K2401 emulator result was $RUN_CONCLUSION; inspect diagnostic artifacts."
          fi
          if [[ "$POWER" != 'VM deallocated' && "$POWER" != 'VM running' ]]; then
            echo "::warning::Unexpected VM power state: $POWER"
          fi
      - name: Azure logout
        if: always() && steps.window.outputs.active == 'true'
        shell: bash
        run: az logout || true
