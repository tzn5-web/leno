name: Azure Android VM guest bootstrap audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/azure-android-vm-guest-audit.yml']
permissions: {contents: read, id-token: write}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: azure/login@v3
        with:
          client-id: 50a5c260-15a0-4aa0-9e02-5f0ad5c23df9
          tenant-id: 779623db-ec2e-495b-9828-85d42baa77ee
          subscription-id: 0ac7a514-32b3-47bf-bf89-e17906b1cc86
      - name: Check guest cloud-init and tool install logs (read only)
        shell: bash
        run: |
          set -euo pipefail
          az vm run-command invoke --resource-group rg-chatgpt-azure \
            --name android-dev-linux --command-id RunShellScript \
            --scripts 'echo ======READY======; test -f /var/lib/android-dev/installed && echo INSTALLED || echo NOT_YET; echo ======SERVICE======; systemctl is-active android-dev-resume.service || true; systemctl show android-dev-resume.service -p SubState -p ExecMainStatus -p Result || true; echo ======FAIL_MARKER======; ls -l /var/lib/android-dev/failed 2>/dev/null || true; echo ======LOGTAIL======; tail -n 17 /var/log/android-dev-bootstrap.log 2>/dev/null || true; echo ======DISK======; df -h / | tail -1' \

            --query 'value[0].message' -o tsv
      - if: always()
        run: az logout || true
