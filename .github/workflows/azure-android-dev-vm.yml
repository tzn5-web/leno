name: Azure Android Linux development VM (one-time provision, budget guarded)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-android-dev-vm.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Provision/finish installing, inspect, start or deallocate the dedicated VM'
        required: true
        type: choice
        default: status
        options: [status, provision, start, deallocate]

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-android-dev-vm
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      AZURE_SUBSCRIPTION_ID: 0ac7a514-32b3-47bf-bf89-e17906b1cc86
      RESOURCE_GROUP: rg-chatgpt-azure
      VM_NAME: android-dev-linux
      VM_REGION: swedencentral
      VM_SIZE: Standard_D4as_v5
      ACTION: ${{ github.event.inputs.operation || 'provision' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts and pinned input
        shell: bash
        run: |
          set -euo pipefail
          bash -n infra/azure-dev-vm/bootstrap.sh
          grep -q '^#cloud-config' infra/azure-dev-vm/cloud-init.yml
          grep -q '__BOOTSTRAP_COMMIT__' infra/azure-dev-vm/cloud-init.yml
          grep -q '^ssh-ed25519 ' infra/azure-dev-vm/id_ed25519_azure_android_dev.pub
          echo 'STATIC_GATES=PASS'

      - name: Login to Azure using existing GitHub OIDC identity
        uses: azure/login@v3
        with:
          client-id: 50a5c260-15a0-4aa0-9e02-5f0ad5c23df9
          tenant-id: 779623db-ec2e-495b-9828-85d42baa77ee
          subscription-id: 0ac7a514-32b3-47bf-bf89-e17906b1cc86

      - name: Deploy, inspect or control dedicated VM
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          case "$ACTION" in
            provision)
              if az vm show -g "$RESOURCE_GROUP" -n "$VM_NAME" -o none >/dev/null 2>&1; then
                MARK="$(az vm show -g "$RESOURCE_GROUP" -n "$VM_NAME" --query tags.managedBy -o tsv)"
                test "$MARK" = github-azure-android-dev || { echo 'ERROR: VM name collision; refusing to alter unrelated VM'; exit 9; }
                echo 'VM_ALREADY_EXISTS=YES'
                STATE="$(az vm show -g "$RESOURCE_GROUP" -n "$VM_NAME" --show-details --query powerState -o tsv)"
                if [ "$STATE" = 'VM deallocated' ]; then
                  az vm start -g "$RESOURCE_GROUP" -n "$VM_NAME" -o none
                fi
              else
                SHA="$(sha256sum infra/azure-dev-vm/bootstrap.sh | awk '{print $1}')"
                sed -e "s/__BOOTSTRAP_COMMIT__/$GITHUB_SHA/g" -e "s/__BOOTSTRAP_SHA256__/$SHA/g" \
                  infra/azure-dev-vm/cloud-init.yml >/tmp/azure-android-dev-cloud-init.yml
                test "$(wc -c </tmp/azure-android-dev-cloud-init.yml)" -lt 65536
                az vm create \
                  --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" \
                  --location "$VM_REGION" --image Ubuntu2404 \
                  --size "$VM_SIZE" --admin-username dev \
                  --authentication-type ssh \
                  --ssh-key-values infra/azure-dev-vm/id_ed25519_azure_android_dev.pub \
                  --storage-sku StandardSSD_LRS --os-disk-size-gb 128 \
                  --public-ip-sku Standard --nsg-rule SSH \
                  --vnet-name android-dev-vnet --subnet android-dev-subnet \
                  --nsg android-dev-nsg --public-ip-address android-dev-ip \
                  --custom-data /tmp/azure-android-dev-cloud-init.yml \
                  --tags managedBy=github-azure-android-dev purpose=development costControl=deallocate \
                  -o json
                echo 'AZURE_VM_CREATED=YES'
              fi
              # Both nightly auto-deallocation and end-of-workflow deallocation protect credits.
              az vm auto-shutdown -g "$RESOURCE_GROUP" -n "$VM_NAME" --time 2200 -o none
              echo 'AUTO_SHUTDOWN_UTC_2200=PASS'
              COMPLETE=0
              for i in $(seq 1 36); do
                OUT="$(az vm run-command invoke -g "$RESOURCE_GROUP" -n "$VM_NAME" \
                  --command-id RunShellScript \
                  --scripts "if test -f /var/lib/android-dev/installed; then echo ANDROID_DEV_READY; elif test -f /var/lib/android-dev/failed; then echo ANDROID_DEV_FAILED; else echo ANDROID_DEV_INSTALLING; fi" \
                  --query 'value[0].message' -o tsv 2>&1)" || true
                echo "INSTALL_POLL=$i $(echo "$OUT" | tail -c 350 | tr '\n' ' ')"
                if echo "$OUT" | grep -q ANDROID_DEV_READY; then COMPLETE=1; break; fi
                if echo "$OUT" | grep -q ANDROID_DEV_FAILED; then
                  echo 'ANDROID_DEV_BOOTSTRAP_FAILED; consult cloud-init-output.log via Run Command'
                  exit 8
                fi
                sleep 30
              done
              test "$COMPLETE" = 1 || { echo 'ANDROID_DEV_INSTALL_TIMEOUT'; exit 7; }
              az vm run-command invoke -g "$RESOURCE_GROUP" -n "$VM_NAME" \
                --command-id RunShellScript --scripts 'sudo /usr/local/bin/android-dev-status' \
                --query 'value[0].message' -o tsv
              echo 'AZURE_ANDROID_DEV_SETUP=PASS'
              ;;
            start)
              MARK="$(az vm show -g "$RESOURCE_GROUP" -n "$VM_NAME" --query tags.managedBy -o tsv)"
              test "$MARK" = github-azure-android-dev
              az vm auto-shutdown -g "$RESOURCE_GROUP" -n "$VM_NAME" --time 2200 -o none
              az vm start -g "$RESOURCE_GROUP" -n "$VM_NAME" -o none
              echo 'AZURE_ANDROID_DEV=STARTED; AUTO_SHUTDOWN=22:00_UTC'
              ;;
            deallocate)
              MARK="$(az vm show -g "$RESOURCE_GROUP" -n "$VM_NAME" --query tags.managedBy -o tsv)"
              test "$MARK" = github-azure-android-dev
              az vm deallocate -g "$RESOURCE_GROUP" -n "$VM_NAME" -o none
              echo 'AZURE_ANDROID_DEV=DEALLOCATED'
              ;;
            status)
              az vm show -g "$RESOURCE_GROUP" -n "$VM_NAME" --show-details \
                --query '{name:name,location:location,size:hardwareProfile.vmSize,provisioningState:provisioningState,powerState:powerState}' -o json
              az vm list-ip-addresses -g "$RESOURCE_GROUP" -n "$VM_NAME" -o json
              echo 'AZURE_ANDROID_DEV_STATUS=PASS'
              ;;
            *) echo "Unsupported ACTION $ACTION"; exit 2 ;;
          esac

      - name: Always deallocate after provisioning (including failures)
        if: ${{ always() && (github.event_name == 'push' || inputs.operation == 'provision') }}
        shell: bash
        run: |
          set -u
          MARK="$(az vm show -g "$RESOURCE_GROUP" -n "$VM_NAME" --query tags.managedBy -o tsv 2>/dev/null || true)"
          if [ "$MARK" = github-azure-android-dev ]; then
            az vm deallocate -g "$RESOURCE_GROUP" -n "$VM_NAME" -o none
            echo 'VM_DEALLOCATED_AFTER_PROVISION=PASS'
          else
            echo 'No VM belonging to this workflow was found; nothing to deallocate'
          fi

      - name: Azure logout
        if: always()
        run: az logout || true
