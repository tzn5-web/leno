name: Azure SHAREit auto-build after private upload
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/azure-shareit-auto-trigger.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  actions: write
jobs:
  upload-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: azure/login@v3
        with:
          client-id: 50a5c260-15a0-4aa0-9e02-5f0ad5c23df9
          tenant-id: 779623db-ec2e-495b-9828-85d42baa77ee
          subscription-id: 0ac7a514-32b3-47bf-bf89-e17906b1cc86
      - name: Trigger VM build only after verified private upload (stop monitoring on expiry)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO=tzn5-web/leno
          SELF=azure-shareit-auto-trigger.yml
          ACC=tzn5androidartifacts26
          CONT=apks-private
          INPUT=input/shareit-6.27.58-user.apks
          OUTPUT=output/shareit-6.27.58-azure-nosads-splits.apks
          EXPIRY='2026-10-28T17:49:00Z'
          if [ "$(date -u +%s)" -gt "$(date -u -d "$EXPIRY" +%s)" ]; then
            echo 'UPLOAD_SESSION_EXPIRED; stopping further checks'
            gh api --method PUT "repos/$REPO/actions/workflows/$SELF/disable" >/dev/null || true
            exit 0
          fi
          KEY="$(az storage account keys list -g rg-chatgpt-azure -n "$ACC" --query '[0].value' -o tsv)"
          echo "::add-mask::$KEY"
          OUTPUT_EXISTS="$(az storage blob exists --account-name "$ACC" --account-key "$KEY" --container-name "$CONT" --name "$OUTPUT" --query exists -o tsv)"
          if [ "$OUTPUT_EXISTS" = True ] || [ "$OUTPUT_EXISTS" = true ]; then
            echo 'AZURE_OUTPUT_ALREADY_PRESENT; no VM needed'
            gh api --method PUT "repos/$REPO/actions/workflows/$SELF/disable" >/dev/null || true
            exit 0
          fi
          INPUT_EXISTS="$(az storage blob exists --account-name "$ACC" --account-key "$KEY" --container-name "$CONT" --name "$INPUT" --query exists -o tsv)"
          if [ "$INPUT_EXISTS" != True ] && [ "$INPUT_EXISTS" != true ]; then
            echo 'PRIVATE_INPUT_NOT_YET_UPLOADED; VM left deallocated'
            exit 0
          fi
          SIZE="$(az storage blob show --account-name "$ACC" --account-key "$KEY" --container-name "$CONT" --name "$INPUT" --query properties.contentLength -o tsv)"
          if [ "$SIZE" != '70930002' ]; then
            echo "INPUT_SIZE_INVALID=$SIZE; expected 70930002; no VM allocated"
            exit 0
          fi
          echo 'PRIVATE_ORIGINAL_PRESENT=PASS'
          gh api --method POST "repos/$REPO/actions/workflows/azure-shareit-user-splits-build.yml/dispatches" -f ref=main >/dev/null
          echo 'AZURE_USER_SHAREIT_VM_BUILD_DISPATCHED=PASS'
          gh api --method PUT "repos/$REPO/actions/workflows/$SELF/disable" >/dev/null || echo 'WARNING: auto-check could not disable itself'
      - if: always()
        run: az logout || true
