name: VancedIOS Inject User IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct HTTPS URL to your own decrypted YouTube IPA"
        required: true
        type: string
      display_name:
        description: "Installed app name"
        required: true
        default: "YouTube"
        type: string
      bundle_id:
        description: "Output bundle ID; official ID gives maximum compatibility"
        required: true
        default: "com.google.ios.youtube"
        type: string

permissions:
  contents: read

concurrency:
  group: vanced-ios-inject-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  inject:
    runs-on: macos-latest
    timeout-minutes: 55

    steps:
      - name: Mask host URL
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: echo "::add-mask::$IPA_URL"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build and injection dependencies
        run: |
          set -euo pipefail
          brew install make ldid dpkg
          pipx install "git+https://github.com/asdfzxcvbn/pyzule-rw.git@740d3716dcd98c20c000f12cdb88f1f0b2a533a4"

      - name: Build and audit pinned tweak layers
        run: |
          set -euo pipefail
          python3 VancedIOS/Scripts/stage_runner.py \
            --build \
            --report-dir artifacts/vanced-ios-build-audit

      - name: Download user-supplied decrypted host
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fL \
            --retry 3 --retry-delay 2 \
            "$IPA_URL" -o base_youtube.ipa
          test -s base_youtube.ipa

      - name: Inject and run full IPA audit
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          set -euo pipefail
          python3 VancedIOS/Scripts/stage_runner.py \
            --ipa base_youtube.ipa \
            --inject \
            --output VancedIOS.ipa \
            --bundle-id "$BUNDLE_ID" \
            --display-name "$DISPLAY_NAME" \
            --report-dir artifacts/vanced-ios-full-audit
          shasum -a 256 VancedIOS.ipa | tee VancedIOS.ipa.sha256

      - name: Upload validated VancedIOS IPA
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VancedIOS-user-host-unsigned
          path: |
            VancedIOS.ipa
            VancedIOS.ipa.sha256
          if-no-files-found: error

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VancedIOS-injection-audit
          path: |
            artifacts/vanced-ios-build-audit/
            artifacts/vanced-ios-full-audit/
          if-no-files-found: warn

      - name: Remove host and generated IPA from runner
        if: always()
        run: rm -f base_youtube.ipa VancedIOS.ipa
