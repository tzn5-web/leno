name: VancedIOS Patch Build

on:
  push:
    branches:
      - vanced-ios-patcher
    paths:
      - "VancedIOS/**"
      - ".github/workflows/vanced-ios-build.yml"
  workflow_dispatch:

concurrency:
  group: vanced-ios-patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: brew install make ldid dpkg

      - name: Audit architecture
        run: python3 VancedIOS/Scripts/audit.py

      - name: Build pinned patch layers
        run: |
          set -euo pipefail
          chmod +x VancedIOS/Scripts/build_patches.sh
          VancedIOS/Scripts/build_patches.sh | tee vanced-ios-build.log

      - name: Audit package contents
        run: |
          set -euo pipefail
          test -f dist/vanced-ios/youmod.deb
          test -f dist/vanced-ios/youpip.deb
          test -f dist/vanced-ios/return-youtube-dislikes.deb
          test -f dist/vanced-ios/vancedios-core.deb

          for pkg in dist/vanced-ios/*.deb; do
            echo "===== $pkg ====="
            dpkg-deb -c "$pkg"
          done | tee vanced-ios-packages.log

          dpkg-deb -c dist/vanced-ios/vancedios-core.deb             | grep -qi 'VancedIOSCore.*dylib'
          dpkg-deb -c dist/vanced-ios/youmod.deb             | grep -qi 'YouMod.*dylib'
          dpkg-deb -c dist/vanced-ios/youpip.deb             | grep -qi 'YouPiP.*dylib'

      - name: Write hashes
        run: |
          shasum -a 256 dist/vanced-ios/*.deb | tee SHA256SUMS

      - name: Upload patch bundle
        uses: actions/upload-artifact@v7
        with:
          name: VancedIOS-patch-bundle
          path: |
            dist/vanced-ios/*.deb
            SHA256SUMS
            VancedIOS/manifest.json
            VancedIOS/README.md
          if-no-files-found: error

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VancedIOS-build-evidence
          path: |
            vanced-ios-build.log
            vanced-ios-packages.log
          if-no-files-found: ignore
