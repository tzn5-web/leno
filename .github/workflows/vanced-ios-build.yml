name: VancedIOS Patch Build

on:
  push:
    branches:
      - vanced-ios-patcher
    paths:
      - "VancedIOS/**"
      - ".github/workflows/vanced-ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanced-ios-patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: brew install make ldid dpkg

      - name: Run exhaustive hostless stage audit and build
        run: |
          set -euo pipefail
          python3 VancedIOS/Scripts/stage_runner.py \
            --build \
            --report-dir artifacts/vanced-ios-stage-audit

      - name: Upload patch bundle
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VancedIOS-patch-bundle
          path: |
            dist/vanced-ios/*.deb
            artifacts/vanced-ios-stage-audit/SHA256SUMS
            VancedIOS/manifest.json
            VancedIOS/README.md
          if-no-files-found: error

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VancedIOS-stage-audit
          path: artifacts/vanced-ios-stage-audit/
          if-no-files-found: warn
