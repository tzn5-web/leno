name: YoutubeVcd
options:
  bundleIdPrefix: com.tzn5web
  deploymentTarget:
    iOS: "17.0"

packages:
  MPVKit:
    url: https://github.com/yattee/MPVKit.git
    exactVersion: 1.0.1
  YouTubeKit:
    url: https://github.com/b5i/YouTubeKit.git
    revision: 6532af39da4c1612b0a1af603792419d8fb0e67f

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  YoutubeVcd:
    type: application
    platform: iOS
    sources:
      - path: V9
      - path: Leno/Assets.xcassets
    dependencies:
      - package: MPVKit
        product: MPVKit
      - package: YouTubeKit
        product: YouTubeKit
    info:
      path: Leno/Info.plist
      properties:
        CFBundleDisplayName: YoutubeVcd
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: "YoutubeVcd poate folosi opțional un VcdResolver din rețeaua locală ca fallback."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tzn5web.leno
        PRODUCT_NAME: YoutubeVcd
        MARKETING_VERSION: "0.11.0"
        CURRENT_PROJECT_VERSION: "7"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
