name: YoutubeVcd
options:
  bundleIdPrefix: com.tzn5web
  deploymentTarget:
    iOS: "17.0"

packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    revision: e5b7d0396ce12bf3444f0d209e8436c83373b7af

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  YoutubeVcd:
    type: application
    platform: iOS
    sources:
      - path: Leno
    dependencies:
      - package: YouTubeKit
    info:
      path: Leno/Info.plist
      properties:
        CFBundleDisplayName: YoutubeVcd
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tzn5web.leno
        PRODUCT_NAME: YoutubeVcd
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
