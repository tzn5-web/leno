plugins { id 'com.android.application' }
def googleMapsApiKey = (System.getenv('K2401_MAPS_API_KEY') ?: '').trim()
// The parallel package installs alongside an older K2401 with a different
// certificate, with no uninstall/data loss. CI builds both via Azure Key Vault.
def parallelInstall = 'YES'.equalsIgnoreCase(System.getenv('K2401_PARALLEL_APK') ?: '')
android {
 namespace 'ro.evolauncher.k2401'
 compileSdk 35
 defaultConfig {
   applicationId parallelInstall ? 'ro.evolauncher.k2401.ultra' : 'ro.evolauncher.k2401'
   minSdk 26
   targetSdk 28
   versionCode 123
   versionName parallelInstall ? '1.0.123-v118-glass-hud-parallel' : '1.0.123-v118-glass-hud'
   manifestPlaceholders = [MAPS_API_KEY: googleMapsApiKey, APP_LABEL: (parallelInstall ? 'EVO Ultra (Test)' : 'EVO Launcher')]
   buildConfigField 'boolean', 'GOOGLE_MAPS_CONFIGURED', googleMapsApiKey.isEmpty() ? 'false' : 'true'
 }
 signingConfigs {
   release {
     // A long-lived private keystore is fetched from Azure Key Vault by CI.
     storeFile file(System.getenv('K2401_RELEASE_KEYSTORE') ?: 'unconfigured-release-keystore.jks')
     storePassword System.getenv('K2401_RELEASE_PASSWORD') ?: ''
     keyAlias 'k2401release'
     keyPassword System.getenv('K2401_RELEASE_PASSWORD') ?: ''
   }
 }
 // This APK is sideloaded privately on Android 10, not published to Google Play.
 // The legacy head unit needs its existing Android 10 compatibility contract.
 lint { disable 'ExpiredTargetSdkVersion' }
 buildFeatures { aidl true; buildConfig true }
 buildTypes {
   debug { minifyEnabled false }
   release {
     signingConfig signingConfigs.release
     minifyEnabled false
     debuggable false
   }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  // SDK is present; it is only initialized with a configured restricted Maps key.
  implementation 'com.google.android.gms:play-services-maps:19.2.0'
  // Native OSM MapView: no JavaScript CDN, WebView or API key required.
  implementation 'org.osmdroid:osmdroid-android:6.1.20'
}

 // Produce exact 2x scene assets before packaging, both debug and signed release.
 // They are derived from the 21 original screenshots at build time. Android
 // keeps original skins/skin_XX.webp as a fallback if HiRes decode fails.
 tasks.register('generateUhdSkins', Exec) {
   workingDir rootProject.projectDir
   commandLine 'python3', "${rootProject.projectDir}/scripts/build-uhd-skins.py"
   inputs.files fileTree('src/main/assets/skins') { include 'skin_??.webp' }
   outputs.dir file('src/main/assets/skins/uhd')
   outputs.dir file('src/main/assets/skins/clean')
   inputs.file file("${rootProject.projectDir}/scripts/build-clean-scenes.py")
   inputs.file file("${rootProject.projectDir}/scripts/models/FSRCNN_x2.pb.base64")
 }
 tasks.named('preBuild') { dependsOn tasks.named('generateUhdSkins') }

 // 3 cinematic HUD wallpapers at exactly 3840x2160 from the three NEW approved
 // user-generated artworks. Baked UI is cleared before native live overlays.
 tasks.register('generateCinematic4k', Exec) {
   dependsOn tasks.named('generateUhdSkins')
   workingDir rootProject.projectDir
   commandLine 'python3', "${rootProject.projectDir}/scripts/generate-cinematic-4k.py"
   inputs.file file("${rootProject.projectDir}/scripts/generate-cinematic-4k.py")
   inputs.files files(
     'src/main/assets/skins/cinematic/approved-A1.webp',
     'src/main/assets/skins/cinematic/approved-02.webp',
     'src/main/assets/skins/cinematic/approved-A3.webp'
   )
   inputs.files fileTree('src/main/assets/skins/clean') { include 'skin_??.webp' }
   outputs.dir file('src/main/assets/skins/cinematic')
 }
 tasks.named('preBuild') { dependsOn tasks.named('generateCinematic4k') }

 // Original 4K EVO RED cinematic scene is produced deterministically during
 // CI, not stretched from the 1280x720 user preview. Live HUD is native Canvas.
 tasks.register('generateEvoRed4k', Exec) {
   workingDir rootProject.projectDir
   commandLine 'python3', "${rootProject.projectDir}/scripts/generate-evo-red-4k.py"
   inputs.file file("${rootProject.projectDir}/scripts/generate-evo-red-4k.py")
   outputs.file file('src/main/assets/skins/approved/evo-red-scene-3840x2160.webp')
 }
 tasks.named('preBuild') { dependsOn tasks.named('generateEvoRed4k') }
