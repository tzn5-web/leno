plugins { id 'com.android.application' }
def googleMapsApiKey = (System.getenv('K2401_MAPS_API_KEY') ?: '').trim()
android {
 namespace 'ro.evolauncher.k2401'
 compileSdk 35
 defaultConfig {
   applicationId 'ro.evolauncher.k2401'
   minSdk 26
   targetSdk 28
   versionCode 105
   versionName '1.0.105-original21-visual-repair'
   manifestPlaceholders = [MAPS_API_KEY: googleMapsApiKey]
   buildConfigField 'boolean', 'GOOGLE_MAPS_CONFIGURED', googleMapsApiKey.isEmpty() ? 'false' : 'true'
 }
 signingConfigs {
   release {
     // A long-lived private keystore is fetched from Azure Key Vault by CI.
     storeFile file(System.getenv('K2401_RELEASE_KEYSTORE') ?: 'unconfigured-release-keystore.jks')
     storePassword System.getenv('K2401_RELEASE_PASSWORD') ?: ''
     keyAlias 'k2401release'
     keyPassword System.getenv('K2401_RELEASE_PASSWORD') ?: ''
   }
 }
 // This APK is sideloaded privately on Android 10, not published to Google Play.
 // The legacy head unit needs its existing Android 10 compatibility contract.
 lint { disable 'ExpiredTargetSdkVersion' }
 buildFeatures { aidl true; buildConfig true }
 buildTypes {
   debug { minifyEnabled false }
   release {
     signingConfig signingConfigs.release
     minifyEnabled false
     debuggable false
   }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  // SDK is present; it is only initialized with a configured restricted Maps key.
  implementation 'com.google.android.gms:play-services-maps:19.2.0'
  // Native OSM MapView: no JavaScript CDN, WebView or API key required.
  implementation 'org.osmdroid:osmdroid-android:6.1.20'
}

 // Produce exact 2x scene assets before packaging, both debug and signed release.
 // They are derived from the 21 original screenshots at build time. Android
 // keeps original skins/skin_XX.webp as a fallback if HiRes decode fails.
 tasks.register('generateUhdSkins', Exec) {
   workingDir rootProject.projectDir
   commandLine 'python3', "${rootProject.projectDir}/scripts/build-uhd-skins.py"
   inputs.files fileTree('src/main/assets/skins') { include 'skin_??.webp' }
   outputs.dir file('src/main/assets/skins/uhd')
   outputs.dir file('src/main/assets/skins/clean')
   inputs.file file("${rootProject.projectDir}/scripts/build-clean-scenes.py")
   inputs.file file("${rootProject.projectDir}/scripts/models/FSRCNN_x2.pb.base64")
 }
 tasks.named('preBuild') { dependsOn tasks.named('generateUhdSkins') }
