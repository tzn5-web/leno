plugins { id 'com.android.application' }
android {
    namespace 'dev.velolink.offline'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.velolink.offline'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
